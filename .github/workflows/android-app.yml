name: Android-App bauen

# Baut bei jeder Änderung an der Rechenwiese eine installierbare APK-Datei.
on:
  push:
    paths:
      - 'lernapp/**'
      - 'app/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:
  # Wird auch nach dem Bearbeiten von Summis Stimme aufgerufen (stimme.yml)
  workflow_call:
    inputs:
      ref:
        description: 'Branch, der gebaut wird'
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Rechenwiese-APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Teil aus lernapp/index.html bauen
        run: npm run build:web

      # Startet die App mit der echten Android-Brücke von Capacitor. Startet sie nicht, gibt es keine APK.
      - name: Starttest
        run: |
          npx playwright install --with-deps chromium
          npm test

      # Passen die eingesprochenen Sätze noch zur App? Geänderte Sätze spricht sonst die Computerstimme.
      - name: Sprechliste prüfen
        run: node stimme/sprechliste.mjs --check || echo "::warning::Die Sprechliste passt nicht mehr zur App. Geänderte Sätze spricht die Computerstimme."

      - name: Android-Projekt anlegen
        run: npx cap add android

      # Mikrofon für "Summis Stimme aufnehmen" (Android fragt beim ersten Aufnehmen nach)
      - name: Mikrofon erlauben
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml

      - name: App-Symbol und Startbild erzeugen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#e6f2f6' --splashBackgroundColor '#e6f2f6' --splashBackgroundColorDark '#0f2228'

      # Minuten seit Anfang 2026: wird mit jedem Bau größer, egal welcher Ablauf baut.
      # Android installiert ein Update nur, wenn die Nummer größer ist als die der installierten App.
      - name: Versionsnummer setzen
        run: |
          CODE=$(( ($(date +%s) - 1767225600) / 60 ))
          echo "VERSION=1.0.$CODE" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1$/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$CODE\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      # Immer derselbe Schlüssel, damit Updates über die alte App installiert werden können
      # und der Fortschritt (Garten, Pfad, Rekorde) erhalten bleibt. Der Schlüssel wird direkt in
      # die Bau-Einstellung eingetragen, statt sich auf den Standard-Ordner von Gradle zu verlassen.
      - name: Festen Signatur-Schlüssel eintragen
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // Rechenwiese: immer mit dem festen Schlüssel aus app/signing signieren
          android {
              signingConfigs {
                  debug {
                      storeFile file("../../signing/rechenwiese-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
          tail -14 android/app/build.gradle

      - name: Web-Teil in das Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rechenwiese.apk

      # Prüft mit dem offiziellen Android-Werkzeug, dass die APK mit dem festen Schlüssel signiert ist.
      # Sonst lehnt Android das Update ab ("App nicht installiert").
      - name: Signatur prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          EXPECTED="$(keytool -list -v -keystore signing/rechenwiese-debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "Erwarteter Fingerabdruck: $EXPECTED"
          echo "--- Neue APK:"
          "$APKSIGNER" verify --print-certs Rechenwiese.apk | tee new-cert.txt
          echo "--- Bisher veröffentlichte APK (zum Vergleich):"
          if gh release download rechenwiese-app --repo "$GITHUB_REPOSITORY" --pattern Rechenwiese.apk --output previous.apk 2>/dev/null; then
            "$APKSIGNER" verify --print-certs previous.apk | grep "SHA-256" || true
          fi
          grep -qi "SHA-256 digest: $EXPECTED" new-cert.txt || { echo "FEHLER: APK ist nicht mit dem festen Schlüssel signiert"; exit 1; }
          echo "OK: APK ist mit dem festen Schlüssel signiert."

      - uses: actions/upload-artifact@v4
        with:
          name: Rechenwiese-APK
          path: app/Rechenwiese.apk

      # Nur der Arbeits-Branch und master ersetzen die App zum Herunterladen, Versuche auf anderen Branches nicht
      - name: Als Download bereitstellen
        if: ${{ contains(fromJSON('["ccr-daadfa50-cgyznk", "master"]'), inputs.ref || github.ref_name) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rechenwiese-app
          name: Rechenwiese für Android
          make_latest: true
          files: app/Rechenwiese.apk
          body: |
            Die neueste Rechenwiese als Android-App (Version ${{ env.VERSION }}).

            So installierst du sie:
            1. Auf dem Android-Handy oder Tablet unten bei „Assets“ auf **Rechenwiese.apk** tippen.
            2. Die heruntergeladene Datei öffnen.
            3. Falls Android fragt: Installation aus dieser Quelle erlauben.
            4. „Installieren“ tippen.

            Neue Versionen werden genauso installiert. Garten, Pfad und Rekorde bleiben erhalten.
