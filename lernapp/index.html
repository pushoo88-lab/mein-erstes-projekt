          <b>·</b><span>je, jede, das Doppelte</span>
          <b>:</b><span>gerecht verteilen, die Hälfte</span></div>` },
      { h: "Welche Zahl bin ich?", p: "Rechne rückwärts. Wurde etwas dazugezählt, nimmst du es wieder weg.",
        ex: ex("Meine Zahl + 9 = 19", "19 − 9 = 10", "Ich bin die 10.") },
    ] },
    { id: "luecke", title: "Lückenaufgaben", cards: [
      { h: "Rückwärts rechnen", p: "Bei einer Lücke hilft die Umkehraufgabe. Aus Plus wird Minus, aus Mal wird Geteilt.",
        ex: ex("7 + ? = 12", "12 − 7 = 5", "Probe: 7 + 5 = 12. Stimmt!") },
    ] },
  ];

  // Zeigt nur die Tricks eines Themas. So steht das Passende immer gleich oben, ohne Scrollen.
  function renderTricks(id) {
    $("trickNav").innerHTML = TRICKS.map((g) =>
      `<button type="button" data-jump="${g.id}" aria-pressed="${g.id === id}">${g.title}</button>`).join("");
    $("tricks").innerHTML = TRICKS.filter((g) => g.id === id).map((g) => `<section class="trick-group" id="trick-${g.id}"><h2>${g.title}</h2>` +
      g.cards.map((c) => `<article class="sheet trick"><h3>${c.h}</h3>${c.p ? `<p>${c.p}</p>` : ""}${c.html || ""}` +
        `${c.ex || ""}${c.pic ? `<div class="pic">${c.pic()}</div>` : ""}</article>`).join("") + "</section>").join("");
    showActiveTab();
  }

  // Rollt die Themenleiste so, dass der gewählte Reiter zu sehen ist
  function showActiveTab() {
    requestAnimationFrame(() => {
      const nav = $("trickNav"), b = nav.querySelector('[aria-pressed="true"]');
      if (b) nav.scrollLeft = b.offsetLeft - nav.offsetLeft - 16;
    });
  }

  let tricksFrom = "startView";
  const hasTricks = (id) => TRICKS.some((g) => g.id === id);
  function openTricks(topic) {
    tricksFrom = ["gameView", "resultView"].find((id) => !$(id).hidden) || "startView";
    // Aus einer Aufgabe: Thema der Aufgabe. Von der Startseite: erstes gewähltes Thema.
    const id = hasTricks(topic) ? topic : state.topics.find(hasTricks) || "plus";
    renderTricks(id);
    $("tricksBack").textContent = tricksFrom === "gameView" ? "← Zurück zur Aufgabe" : "← Zurück";
    show("tricksView");
    showActiveTab();
  }

  // ---------- Ballonjagd ----------
  const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  // Drei falsche Antworten, die nah an der richtigen liegen
  function choices(ans, N) {
    const set = new Set([ans]);
    const steps = ans >= 1000 ? [1000, 100, 10] : ans >= 100 ? [100, 10, 1] : ans >= 20 ? [10, 1, 2] : [1, 2, 3];
    const near = [];
    for (const st of steps) near.push(ans + st, ans - st);
    const d = String(ans);
    if (d.length >= 2 && d.at(-1) !== d.at(-2)) near.push(Number(d.slice(0, -2) + d.at(-1) + d.at(-2)));  // Zahlendreher
    for (const c of shuffle(near)) if (set.size < 4 && c >= 0 && c <= Math.max(N, ans + 10)) set.add(c);
    while (set.size < 4) set.add(Math.max(0, ans + R(-9, 9)));
    return shuffle([...set]);
  }

  function balloonSVG(color) {
    return `<svg viewBox="0 0 80 120" aria-hidden="true"><path d="M40 93q-7 12 2 26" stroke="var(--ink-soft)" stroke-width="1.5" fill="none"/>` +
      `<ellipse cx="40" cy="45" rx="35" ry="43" fill="${color}"/><path d="M34 87h12l-6 7z" fill="${color}"/>` +
      `<ellipse cx="27" cy="27" rx="7" ry="12" fill="#fff" opacity=".35"/></svg>`;
  }

  const bj = { running: false, raf: 0 };

  function startBalloons() {
    if (!ready()) return;
    bj.gen = (bj.gen || 0) + 1;
    const L = state.level && LEVELS[state.level.i];
    bj.target = L && L.type === "ballon" ? L.target : 0;
    Object.assign(bj, { cfg: config(), sel: [...state.topics], score: 0, lives: 3, hits: 0, wave: null, running: true, last: performance.now() });
    $("bjOver").hidden = true;
    $("bjSky").hidden = false;
    $("bjTaskCard").hidden = false;
    show("balloonView");
    sayBj("Tippe auf den Ballon mit der richtigen Lösung!");
    renderBjBar();
    nextWave();
    cancelAnimationFrame(bj.raf);
    bj.raf = requestAnimationFrame(bjFrame);
  }

  // Verzögert die nächste Welle, aber nur wenn noch dasselbe Spiel läuft
  function later(fn, ms) { const gen = bj.gen; setTimeout(() => { if (bj.gen === gen) fn(); }, ms); }

  // Der Himmel füllt den Rest des Bildschirms, damit nichts gescrollt werden muss
  function fitSky() {
    const sky = $("bjSky");
    sky.style.height = "";
    const top = sky.getBoundingClientRect().top;
    sky.style.height = `${Math.round(Math.max(200, Math.min(560, window.innerHeight - top - 12)))}px`;
  }

  function stopBalloons() {
    bj.running = false;
    cancelAnimationFrame(bj.raf);
  }

  function sayBj(text, cls = "") { $("bjSay").textContent = text; $("bjSay").className = "say " + cls; }

  function renderBjBar() {
    $("bjHearts").innerHTML = [0, 1, 2].map((i) => `<span class="${i < bj.lives ? "" : "lost"}">♥</span>`).join("");
    $("bjHearts").setAttribute("aria-label", `${bj.lives} Leben`);
    $("bjScore").textContent = bj.target ? `${bj.hits} / ${bj.target} Ballons` : `${fmt(bj.score)} Punkte`;
  }

  function nextWave() {
    if (!bj.running) return;
    const t = generate(bj.cfg, pick(bj.sel), bj.sel);
    drawTask($("bjTask"), t, '<span class="slot">?</span>');
    fitSky();   // nach dem Anzeigen der Aufgabe, denn deren Höhe ändert sich
    const sky = $("bjSky");
    sky.querySelectorAll(".balloon, .level-up").forEach((n) => n.remove());
    const W = sky.clientWidth, H = sky.clientHeight, lane = W / 4, size = Math.min(lane - 8, 96);
    const balloons = choices(t.answer, bj.cfg.N).map((v, i) => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "balloon";
      el.style.width = `${size}px`;
      const label = fmt(v);
      el.innerHTML = `${balloonSVG(PETALS[(i + bj.hits) % 4])}<span style="font-size:${label.length > 7 ? 15 : label.length > 5 ? 18 : label.length > 3 ? 22 : 26}px">${label}</span>`;
      el.setAttribute("aria-label", `Ballon ${label}`);
      sky.append(el);
      const b = { el, v, x: i * lane + (lane - size) / 2, y: H + R(0, 70), phase: Math.random() * 6, h: size * 1.5, out: false };
      el.addEventListener("click", () => hitBalloon(b));
      return b;
    });
    bj.wave = { t, balloons, done: false, dur: riseTime(t) };
  }

  // Sekunden, die ein Ballon für den Weg nach oben braucht. Schwere Aufgaben bekommen mehr Zeit.
  function riseTime(t) {
    const N = bj.cfg.N;
    let d = N <= 20 ? 10 : N <= 100 ? 14 : N <= 1000 ? 16 : 18;
    if (t.kind === "text") d += 7;
    return d;
  }

  function bjSpeed() {
    const H = $("bjSky").clientHeight;
    const d = bj.wave.dur * Math.max(0.55, 1 - 0.04 * bj.hits);   // mit jedem Treffer etwas schneller
    return H / d;   // Pixel pro Sekunde
  }

  function bjFrame(now) {
    if (!bj.running) return;
    const dt = Math.min(0.05, (now - bj.last) / 1000);
    bj.last = now;
    const w = bj.wave;
    if (w && w.balloons.length) {
      const v = bjSpeed();
      for (const b of w.balloons) {
        if (b.out) continue;
        b.y -= v * dt;
        const wobble = Math.sin(now / 500 + b.phase) * 5;
        b.el.style.transform = `translate(${b.x + wobble}px, ${b.y}px)`;
        if (b.y < -b.h) {
          b.out = true;
          if (!w.done && b.v === w.t.answer) missWave(`Weggeflogen! Die Lösung war ${fmt(w.t.answer)}.`);
        }
      }
    }
    bj.raf = requestAnimationFrame(bjFrame);
  }

  function hitBalloon(b) {
    const w = bj.wave;
    if (!bj.running || !w || w.done || b.out) return;
    if (b.v === w.t.answer) {
      w.done = true;
      b.out = true;
      b.el.classList.add("popped");
      const H = $("bjSky").clientHeight;
      const bonus = Math.max(0, Math.round(10 * b.y / H));   // früh getroffen gibt Extrapunkte
      bj.score += 10 + bonus;
      bj.hits++;
      if (bj.target && bj.hits >= bj.target) {   // Level-Ziel erreicht
        beep(SOUND_RIGHT);
        fx.pop(b.el, 1);
        renderBjBar();
        return later(() => gameOver("Alle Ballons geschafft!", true), 500);
      }
      fx.pop(b.el, 1);
      if (bj.hits % 5 === 0) {
        beep(SOUND_STREAK);
        sayBj(`${bj.hits} Treffer! Jetzt wird es schneller!`, "ok");
        $("bjSky").insertAdjacentHTML("beforeend", `<div class="level-up">Stufe ${bj.hits / 5 + 1}!</div>`);
      } else {
        beep(SOUND_RIGHT);
        sayBj(`${pick(PRAISE)} +${10 + bonus} Punkte`, "ok");
      }
      renderBjBar();
      later(nextWave, bj.hits % 5 === 0 ? 1200 : 650);
      return;
    }
    b.out = true;
    b.el.classList.add("wrong");
    beep(SOUND_WRONG);
    bj.lives--;
    renderBjBar();
    if (bj.lives <= 0) { w.done = true; return gameOver(`Die Lösung war ${fmt(w.t.answer)}.`); }
    sayBj(`${fmt(b.v)} stimmt nicht. Versuch einen anderen Ballon!`, "oops");
  }

  function missWave(text) {
    const w = bj.wave;
    w.done = true;
    beep(SOUND_WRONG);
    bj.lives--;
    renderBjBar();
    if (bj.lives <= 0) return gameOver(text);
    sayBj(text, "oops");
    later(nextWave, 1500);
  }

  function gameOver(lastText, won = false) {
    stopBalloons();
    const best = store.get("rw-bj-best", 0);
    const record = bj.score > best;
    if (record) store.set("rw-bj-best", bj.score);
    const flowers = Math.floor(bj.hits / 3);
    for (let i = 0; i < flowers; i++) state.garden.push("f" + (i % 4));
    state.garden = state.garden.slice(-5000);
    store.set("rw-garden", state.garden);
    renderHeader();
    $("bjSky").hidden = true;
    $("bjTaskCard").hidden = true;
    $("bjOver").hidden = false;
    $("bjOverTitle").textContent = won ? "Level geschafft!" : record && bj.score > 0 ? "Neuer Rekord!" : "Spiel vorbei!";
    $("bjOverText").textContent = `${lastText} Du hast ${bj.hits} Ballons richtig getroffen und ${fmt(bj.score)} Punkte geholt.` +
      (bj.target || (record && bj.score > 0) ? "" : ` Dein Rekord: ${fmt(Math.max(best, bj.score))} Punkte.`) +
      (flowers ? ` ${flowers} ${flowers === 1 ? "Blume wächst" : "Blumen wachsen"} in deinem Garten.` : "") +
      (state.level ? " " + completeLevel(bj.lives, won) : "");
    if (won || (record && bj.score > 0)) { beep(SOUND_PERFECT); fx.show(5); } else beep(SOUND_DONE);
    $("bjAgain").focus();
  }

  // ---------- Abenteuer-Pfad ----------
  const LEVEL_PLACES = ["Blumenwiese", "Bienenstock", "Kleeblattfeld", "Pilzwald", "Teich", "Schmetterlingsgarten",
    "Holzbrücke", "Windmühle", "Sonnenhügel", "Regenbogen", "Wolkenberg", "Honigschloss"];
  const TYPE_NAME = { runde: "Blumen-Runde", ballon: "Ballonjagd", memory: "Zahlen-Memory" };
  const LEVELS = LEVEL_PLACES.map((place, i) => {
    const type = ["runde", "ballon", "memory", "runde"][i % 4];
    const boss = i % 4 === 3;                       // jedes 4. Level ist ein Finale
    const target = 6 + Math.floor(i / 4) * 2;       // Ballons, die getroffen werden müssen
    const goal = boss ? "Großes Finale! Schaffe mindestens 8 von 10 Aufgaben."
      : type === "runde" ? "Schaffe mindestens 7 von 10 Aufgaben."
      : type === "ballon" ? `Triff ${target} Ballons, bevor deine 3 Leben weg sind.`
      : "Finde alle 6 Paare.";
    return { place, type, boss, target, goal, name: boss ? "Großes Finale" : TYPE_NAME[type] };
  });
  const LOCK = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.5" fill="none"/></svg>';

  // Zahlenraum eines Levels: am Anfang ein gutes Drittel, am Ende der ganze eingetippte Zahlenraum
  function levelN(i) {
    const N = state.N, x = N * (0.35 + 0.65 * i / (LEVELS.length - 1));
    const min = state.topics.includes("stellen") ? 20 : MIN_N;
    let n = Math.round(x);
    if (N > 20) { const step = 10 ** Math.max(0, String(n).length - 2); n = Math.round(x / step) * step; }
    return Math.max(min, Math.min(N, n));
  }

  let pathSel = 0;
  function openPath() {
    if (!ready()) return;
    pathSel = Math.min(state.path.done, LEVELS.length - 1);
    renderPath();
    show("pathView");
    beeMood("pathBee", "happy");
  }

  function renderPath(msg) {
    const n = LEVELS.length, rowH = 104, H = n * rowH + 20;
    const xs = [50, 80, 50, 20];
    const pts = LEVELS.map((_, i) => [xs[i % 4], 54 + i * rowH]);
    const done = state.path.done;
    const walked = pts.slice(0, Math.min(done, n - 1) + 1);
    let html = `<svg class="trail" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">` +
      `<polyline points="${pts.map((p) => p.join(",")).join(" ")}"/>` +
      (walked.length > 1 ? `<polyline class="walked" points="${walked.map((p) => p.join(",")).join(" ")}"/>` : "") + "</svg>";
    LEVELS.forEach((L, i) => {
      const [x, y] = pts[i];
      const st = i < done ? "done" : i === done ? "now" : "locked";
      const stars = state.path.stars[i] || 0;
      html += `<button class="node ${st}${L.boss ? " boss" : ""}" type="button" data-level="${i}" aria-pressed="${i === pathSel}"
          style="left:${x}%;top:${y}px" aria-label="Level ${i + 1}, ${L.place}, ${L.name}${st === "locked" ? ", noch zu" : ""}">
        ${st === "locked" ? LOCK : i + 1}${stars ? `<span class="nstars">${"★".repeat(stars)}</span>` : ""}
        <span class="nlabel">${L.place}<small>${L.name}</small></span></button>`;
    });
    // Summi wartet beim aktuellen Level
    const [bx, by] = pts[Math.min(done, n - 1)];
    html += `<div class="bee path-bee" style="left:calc(${bx}% ${bx > 60 ? "- 104px" : "+ 46px"});top:${by - 44}px">${beeSVG()}</div>`;
    $("path").style.height = `${H}px`;
    $("path").innerHTML = html;

    const L = LEVELS[pathSel];
    $("pathSay").textContent = msg || (done >= n && pathSel === n - 1
      ? "Du hast den ganzen Pfad geschafft! Du kannst jedes Level nochmal spielen."
      : `Level ${pathSel + 1}: ${L.place}. ${L.name}! ${L.goal}`);
    $("pathPlay").textContent = `Level ${pathSel + 1} spielen`;
    $("pathCount").textContent = `${Math.min(done, n)} / ${n}`;
  }

  function startLevel(i) {
    state.level = { i, N: levelN(i) };
    setLevelButtons();
    const type = LEVELS[i].type;
    if (type === "runde") startRound();
    else if (type === "ballon") startBalloons();
    else startMemory();
  }

  // Ergebnis eines Levels speichern; gibt den Text für die Ergebnisseite zurück
  function completeLevel(stars, passed) {
    const i = state.level.i;
    if (!passed) return `Für dieses Level fehlt noch ein bisschen. ${LEVELS[i].goal} Versuch es gleich nochmal!`;
    const path = state.path;
    path.stars[i] = Math.max(path.stars[i] || 0, stars);
    let text = `Level ${i + 1} geschafft!`;
    if (i === path.done) {
      path.done++;
      for (let k = 0; k < 3; k++) state.garden.push("f" + k);   // Bonus fürs Freischalten
      store.set("rw-garden", state.garden);
      text += path.done < LEVELS.length ? " Bonus: 3 Blumen! Das nächste Level ist jetzt offen." : " Du hast den ganzen Abenteuer-Pfad geschafft!";
    }
    store.set("rw-path", path);
    renderHeader();
    return text;
  }

  function setLevelButtons() {
    for (const id of ["menuBtn", "bjMenu", "memMenu"]) $(id).textContent = state.level ? "Zum Pfad" : "Zum Start";
  }

  // Zurück aus einem Spiel: im Level zum Pfad, sonst zur Startseite
  function leaveGame() {
    if (state.level) { state.level = null; setLevelButtons(); openPath(); }
    else goHome();
  }

  // ---------- Mein Garten und Gartenladen ----------
  const SHOP = [
    { id: "schnecke", art: "Die", name: "Schnecke", price: 4, pos: [68, 3, 12] },
    { id: "kaefer", art: "Der", name: "Marienkäfer", price: 5, pos: [40, 26, 7] },
    { id: "pilz", art: "Der", name: "Pilz", price: 6, pos: [47, 8, 10] },
    { id: "schmetterling", art: "Der", name: "Schmetterling", price: 8, pos: [58, 64, 11], fly: true },
    { id: "sonnenblume", art: "Die", name: "Sonnenblume", price: 10, pos: [27, 16, 12] },
    { id: "zwerg", art: "Der", name: "Gartenzwerg", price: 12, pos: [14, 3, 12] },
    { id: "vogelhaus", art: "Das", name: "Vogelhaus", price: 15, pos: [3, 30, 17] },
    { id: "teich", art: "Der", name: "Teich", price: 18, pos: [55, 2, 38] },
    { id: "bienenstock", art: "Der", name: "Bienenstock", price: 22, pos: [80, 30, 15] },
    { id: "regenbogen", art: "Der", name: "Regenbogen", price: 30, pos: [4, 44, 92] },
  ];

  function decoSVG(id) {
    const W = "#fff";
    switch (id) {
      case "schnecke": return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M6 88Q6 72 28 74H84Q96 74 94 82Q92 88 80 88Z" fill="#c9b27c"/><path d="M84 76L92 58M78 76L80 58" stroke="#c9b27c" stroke-width="4" stroke-linecap="round"/><circle cx="48" cy="54" r="26" fill="var(--petal-3)"/><path d="M48 54m-4 0a4 4 0 1 1 8 0a10 10 0 1 1-20 0a16 16 0 1 1 32 0" stroke="var(--bee-ink)" stroke-width="3" fill="none"/></svg>`;
      case "kaefer": return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="30" r="13" fill="var(--bee-ink)"/><ellipse cx="50" cy="60" rx="32" ry="28" fill="var(--red)"/><path d="M50 34V88" stroke="var(--bee-ink)" stroke-width="3"/><circle cx="36" cy="52" r="6" fill="var(--bee-ink)"/><circle cx="64" cy="52" r="6" fill="var(--bee-ink)"/><circle cx="38" cy="72" r="5" fill="var(--bee-ink)"/><circle cx="62" cy="72" r="5" fill="var(--bee-ink)"/></svg>`;
      case "pilz": return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="38" y="48" width="24" height="44" rx="9" fill="#efe4cf"/><path d="M8 56Q10 10 50 8Q90 10 92 56Z" fill="var(--red)"/><circle cx="30" cy="34" r="7" fill="${W}"/><circle cx="56" cy="22" r="6" fill="${W}"/><circle cx="72" cy="42" r="6" fill="${W}"/></svg>`;
      case "schmetterling": return `<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="30" cy="38" rx="22" ry="18" fill="var(--petal-2)"/><ellipse cx="70" cy="38" rx="22" ry="18" fill="var(--petal-2)"/><ellipse cx="35" cy="66" rx="15" ry="13" fill="var(--petal-1)"/><ellipse cx="65" cy="66" rx="15" ry="13" fill="var(--petal-1)"/><rect x="46" y="28" width="8" height="50" rx="4" fill="var(--bee-ink)"/><path d="M48 30Q42 16 36 14M52 30Q58 16 64 14" stroke="var(--bee-ink)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
      case "sonnenblume": {
        let petals = "";
        for (let k = 0; k < 12; k++) petals += `<ellipse cx="50" cy="12" rx="7" ry="13" fill="var(--sun)" transform="rotate(${k * 30} 50 32)"/>`;
        return `<svg viewBox="0 0 100 150" aria-hidden="true"><path d="M50 150V50" stroke="var(--stem)" stroke-width="6"/><path d="M50 110c-16-2-24-14-22-24 14 2 22 12 22 24z" fill="var(--grass-deep)"/>${petals}<circle cx="50" cy="32" r="13" fill="#7a4a1a"/></svg>`;
      }
      case "zwerg": return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 2L30 40H70Z" fill="var(--red)"/><circle cx="50" cy="46" r="13" fill="#f2c9a0"/><circle cx="45" cy="44" r="2" fill="var(--bee-ink)"/><circle cx="55" cy="44" r="2" fill="var(--bee-ink)"/><rect x="32" y="60" width="36" height="30" rx="10" fill="var(--blue)"/><path d="M36 50Q50 82 64 50Q58 58 50 58Q42 58 36 50Z" fill="${W}"/><rect x="34" y="88" width="12" height="8" rx="3" fill="var(--bee-ink)"/><rect x="54" y="88" width="12" height="8" rx="3" fill="var(--bee-ink)"/></svg>`;
      case "vogelhaus": return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="46" y="58" width="8" height="42" fill="#8a5a2b"/><rect x="24" y="30" width="52" height="34" rx="3" fill="var(--petal-3)"/><path d="M14 36L50 8L86 36Z" fill="var(--red)"/><circle cx="50" cy="46" r="8" fill="var(--bee-ink)"/><rect x="42" y="57" width="16" height="4" rx="2" fill="#8a5a2b"/></svg>`;
      case "teich": return `<svg viewBox="0 0 100 50" aria-hidden="true"><ellipse cx="50" cy="26" rx="48" ry="22" fill="var(--blue)" opacity=".85"/><ellipse cx="50" cy="24" rx="40" ry="15" fill="var(--petal-4)" opacity=".6"/><path d="M28 26a9 6 0 1 0 14-4l-7 4z" fill="var(--grass-deep)"/><circle cx="66" cy="22" r="4" fill="var(--petal-1)"/></svg>`;
      case "bienenstock": return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="47" y="0" width="6" height="14" fill="#8a5a2b"/><g fill="var(--sun)" stroke="var(--sun-ink)" stroke-opacity=".35" stroke-width="2"><ellipse cx="50" cy="80" rx="32" ry="13"/><ellipse cx="50" cy="60" rx="36" ry="13"/><ellipse cx="50" cy="40" rx="30" ry="12"/><ellipse cx="50" cy="22" rx="20" ry="10"/></g><ellipse cx="50" cy="68" rx="7" ry="8" fill="var(--bee-ink)"/></svg>`;
      case "regenbogen": return `<svg viewBox="0 0 200 100" aria-hidden="true">${["var(--red)", "var(--petal-3)", "var(--sun)", "var(--grass)", "var(--blue)", "var(--petal-2)"]
        .map((c, k) => `<path d="M${10 + k * 9} 100A${90 - k * 9} ${90 - k * 9} 0 0 1 ${190 - k * 9} 100" stroke="${c}" stroke-width="9" fill="none" opacity=".75"/>`).join("")}</svg>`;
    }
    return "";
  }

  // Blumen zum Ausgeben = gewachsene Blumen und Knospen minus Ausgaben
  function balance() {
    return state.garden.filter((f) => f[0] === "f" || f[0] === "g" || f[0] === "b").length - state.spent;
  }

  function openGarden() { renderGarden(); show("gardenView"); beeMood("gardenBee", "happy"); }

  function renderGarden(msg) {
    const bal = balance();
    $("gardenSay").textContent = msg || (bal
      ? `Du hast ${bal} ${bal === 1 ? "Blume" : "Blumen"}. Such dir im Laden etwas Schönes für deinen Garten aus!`
      : "Sammle Blumen beim Spielen und Üben. Dann kannst du hier einkaufen!");
    // Szene: Sonne, Regenbogen, Blumen, dann die anderen Sachen von hinten nach vorn
    const owned = SHOP.filter((it) => state.owned.includes(it.id));
    const place = (it) => `<div class="deco${it.fly ? " fly" : ""}" style="left:${it.pos[0]}%;bottom:${it.pos[1]}%;width:${it.pos[2]}%">${decoSVG(it.id)}</div>`;
    const flowers = state.garden.filter((f) => f[0] !== "s").slice(-40).map((f, k) =>
      `<div class="fl" style="left:${(k * 37) % 90 + 2}%;bottom:${(k * 17) % 34 + 1}%;width:6%">${flowerSVG(f[0] === "g" ? "gold" : f[0] === "b" ? "bud" : "flower", PETALS[Number(f[1]) % 4])}</div>`).join("");
    $("scene").innerHTML = '<div class="sun"></div>' +
      owned.filter((it) => it.id === "regenbogen").map(place).join("") + flowers +
      owned.filter((it) => it.id !== "regenbogen").sort((a, b) => b.pos[1] - a.pos[1]).map(place).join("");
    $("shop").innerHTML = SHOP.map((it) => {
      const own = state.owned.includes(it.id), can = bal >= it.price;
      return `<div class="shop-item${own ? " owned" : ""}"><div class="shop-icon">${decoSVG(it.id)}</div><b>${it.name}</b>` +
        (own ? `<span class="have">Im Garten ✓</span>`
             : `<button class="buy" type="button" data-buy="${it.id}"${can ? "" : " disabled"} aria-label="${it.name} für ${it.price} Blumen kaufen">${flowerSVG("flower", "var(--petal-1)")}${it.price}</button>` +
               (can ? "" : `<small>Noch ${it.price - bal} ${it.price - bal === 1 ? "Blume" : "Blumen"} sammeln</small>`)) + "</div>";
    }).join("");
    renderHeader();
  }

  function buy(id) {
    const it = SHOP.find((x) => x.id === id);
    if (!it || state.owned.includes(id) || balance() < it.price) return;
    state.owned.push(id);
    state.spent += it.price;
    store.set("rw-owned", state.owned);
    store.set("rw-spent", state.spent);
    renderGarden(`Juhu! ${it.art} ${it.name} ist jetzt in deinem Garten.`);
    beep(SOUND_PERFECT);
    fx.pop($("scene"), 3);
    beeMood("gardenBee", "happy");
  }

  // ---------- Zahlen-Memory ----------
  const mem = { cards: [], open: [], moves: 0, found: 0, lock: false };

  // Kurzer Kartentext, z. B. "7 + 5" oder "47 = 40 + □"
  function cardLabel(t) {
    if (t.kind === "parts") return t.parts.join(" ").replace(/ = §$/, "").replace("§", "□");
    if (t.blank === "c") return `${fmt(t.a)} ${t.op} ${fmt(t.b)}`;
    const v = (k) => (t.blank === k ? "□" : fmt(t[k]));
    return `${v("a")} ${t.op} ${v("b")} = ${fmt(t.c)}`;
  }

  function memoryPairs(cfg, sel) {
    const pool = sel.filter((t) => t !== "text");
    const use = pool.length ? pool : opsFor(cfg);
    const pairs = [], answers = new Set();
    const numbersIn = (label) => (label.match(/\d[\d.]*/g) || []).map((x) => Number(x.replace(/\./g, "")));
    for (let guard = 0; pairs.length < 6 && guard < 800; guard++) {
      const strict = guard < 300;   // bei kleinen Zahlenräumen gibt es zu wenige Zahlen, dann lockerer
      const t = guard < 600 ? generate(cfg, pick(use), use) : { ...plusTask(cfg.N), topic: "plus" };
      if (t.kind === "text") continue;
      if (t.topic === "stellen") {   // Stellenwert-Karte, z. B. "3 H + 4 Z + 7 E"
        const k = String(cfg.N - 1).length, n = R(10 ** (k - 1), cfg.N - 1);
        const heads = PLACES.slice(0, k).reverse();
        const parts = String(n).split("").map((d, i) => (d !== "0" ? `${d} ${heads[i][0]}` : "")).filter(Boolean);
        if (answers.has(n)) continue;
        answers.add(n);
        pairs.push({ label: parts.join(" + "), answer: n });
        continue;
      }
      // Auf Karten nur "Aufgabe = ?" zeigen: Lücken werden zur normalen Aufgabe, bei Stellenwerten nur "4 Z + 7 E"
      if (!t.kind && t.blank !== "c") { t.blank = "c"; t.answer = t.c; }
      if (t.kind === "parts" && !/ Z$/.test(t.parts[0])) continue;
      const label = cardLabel(t);
      // Keine Zahl darf doppelt vorkommen, sonst passt eine Karte scheinbar zu zwei anderen
      if (answers.has(t.answer)) continue;
      if (strict && (pairs.some((pp) => numbersIn(pp.label).includes(t.answer)) || numbersIn(label).some((x) => answers.has(x)))) continue;
      answers.add(t.answer);
      pairs.push({ label, answer: t.answer });
    }
    return pairs;
  }

  function startMemory() {
    if (!ready()) return;
    const pairs = memoryPairs(config(), [...state.topics]);
    mem.cards = shuffle(pairs.flatMap((p, i) => [{ pair: i, text: p.label, ans: false }, { pair: i, text: fmt(p.answer), ans: true }]));
    Object.assign(mem, { open: [], moves: 0, found: 0, lock: false });
    const back = flowerSVG("flower", "var(--sun)", "var(--petal-1)");
    $("memGrid").innerHTML = mem.cards.map((c, i) =>
      `<button class="card" type="button" data-card="${i}" aria-label="Karte ${i + 1}, verdeckt"><span class="in">
         <span class="face back">${back}</span><span class="face front${c.ans ? " ans" : ""}">${c.text}</span></span></button>`).join("");
    $("memGrid").hidden = false;
    $("memOver").hidden = true;
    $("memMoves").textContent = "0 Züge";
    $("memSay").textContent = "Finde immer eine Aufgabe und ihr Ergebnis! Tippe zwei Karten an.";
    show("memoryView");
    beeMood("memBee", "happy");
  }

  function flipCard(i) {
    const c = mem.cards[i], el = $("memGrid").children[i];
    if (mem.lock || c.done || mem.open.includes(i)) return;
    el.classList.add("open");
    el.setAttribute("aria-label", c.text);
    mem.open.push(i);
    if (mem.open.length < 2) return;

    mem.moves++;
    $("memMoves").textContent = `${mem.moves} ${mem.moves === 1 ? "Zug" : "Züge"}`;
    const [a, b] = mem.open.map((k) => mem.cards[k]);
    if (a.pair === b.pair) {
      a.done = b.done = true;
      for (const k of mem.open) $("memGrid").children[k].classList.add("done");
      mem.open = [];
      mem.found++;
      beep(SOUND_RIGHT);
      fx.pop(el, 1);
      $("memSay").textContent = `${pick(PRAISE)} ${a.ans ? b.text : a.text} = ${a.ans ? a.text : b.text}`;
      beeMood("memBee", "happy");
      if (mem.found === mem.cards.length / 2) setTimeout(memoryWon, 700);
      return;
    }
    mem.lock = true;
    $("memSay").textContent = "Das passt nicht zusammen. Merk dir, wo die Karten liegen!";
    beeMood("memBee", "think");
    setTimeout(() => {
      for (const k of mem.open) {
        $("memGrid").children[k].classList.remove("open");
        $("memGrid").children[k].setAttribute("aria-label", `Karte ${k + 1}, verdeckt`);
      }
      mem.open = [];
      mem.lock = false;
    }, 1300);
  }

  function memoryWon() {
    const best = store.get("rw-mem-best", 0);
    const record = !best || mem.moves < best;
    if (record) store.set("rw-mem-best", mem.moves);
    for (let i = 0; i < 3; i++) state.garden.push("f" + (i % 4));
    state.garden = state.garden.slice(-5000);
    store.set("rw-garden", state.garden);
    renderHeader();
    $("memGrid").hidden = true;
    $("memOver").hidden = false;
    $("memOverTitle").textContent = record ? "Neuer Rekord!" : "Geschafft!";
    $("memOverText").textContent = `Du hast alle 6 Paare in ${mem.moves} Zügen gefunden. ` +
      (record ? "So wenige Züge hattest du noch nie!" : `Dein Rekord: ${best} Züge.`) + " 3 Blumen wachsen in deinem Garten." +
      (state.level ? " " + completeLevel(mem.moves <= 8 ? 3 : mem.moves <= 12 ? 2 : 1, true) : "");
    $("memSay").textContent = "Super gemacht!";
    beeMood("memBee", "happy");
    if (record || mem.moves <= 9) { beep(SOUND_PERFECT); fx.show(4); } else beep(SOUND_DONE);
    $("memAgain").focus();
  }

  // ---------- Ergebnis ----------
  function finish() {
    const r = state.round;
    const first = r.results.filter((x) => x === "first").length;
    const second = r.results.filter((x) => x === "second").length;
    const missed = r.results.filter((x) => x === "missed").length;
    const stars = first >= 9 ? 3 : first + second >= 7 ? 2 : 1;
    const perfect = first === 10;

    const key = `${state.grade}-${r.N}-${selectionKey(r.sel)}`;
    state.best[key] = Math.max(state.best[key] || 0, stars);
    r.results.forEach((x, i) => {
      if (x === "first") state.garden.push("f" + (i % 4));
      else if (x === "second") state.garden.push("b" + (i % 4));
    });
    if (perfect) state.garden.push("g0");
    state.garden = state.garden.slice(-5000);
    store.set("rw-best", state.best);
    store.set("rw-garden", state.garden);

    $("resultTitle").textContent = perfect ? "Perfekt! Alles richtig!" : stars === 3 ? "Fantastisch!" : stars === 2 ? "Gut gemacht!" : "Weiter so!";
    $("bigStars").innerHTML = [1, 2, 3].map((n) => `<span class="${n <= stars ? "on grow" : "off"}">${STAR}</span>`).join("");
    $("bigStars").setAttribute("aria-label", `${stars} von 3 Sternen`);
    $("resultText").textContent = first === 10
      ? "Alle 10 Aufgaben gleich beim ersten Versuch richtig."
      : `${first + second} von 10 Aufgaben richtig, ${first} davon gleich beim ersten Versuch.`;
    $("tally").innerHTML =
      `<span>${flowerSVG("flower", "var(--petal-1)")} ${first} Blumen</span>` +
      `<span>${flowerSVG("bud", "var(--petal-2)")} ${second} Knospen</span>` +
      `<span>${flowerSVG("sprout")} ${missed} Sprösslinge</span>` +
      (perfect ? `<span>${flowerSVG("gold")} 1 Goldblume</span>` : "");
    if (state.level) $("resultText").textContent += " " + completeLevel(stars, first + second >= (LEVELS[state.level.i].boss ? 8 : 7));
    state.round = null;
    renderHeader();
    show("resultView");
    // Besondere Leistung, besondere Belohnung
    if (perfect) { beep(SOUND_PERFECT); fx.show(7); }
    else if (stars === 3) { beep(SOUND_DONE); fx.show(4); }
    else if (stars === 2) { beep(SOUND_DONE); fx.pop($("bigStars"), 2); }
    else beep(SOUND_DONE);
    $("againBtn").focus();
  }

  // ---------- Ereignisse ----------
  $("pad").innerHTML = ["7", "8", "9", "4", "5", "6", "1", "2", "3", "del", "0", "ok"].map((k) =>
    `<button class="key${k === "ok" ? " ok" : k === "del" ? " del" : ""}" type="button" data-key="${k}"
       aria-label="${k === "ok" ? "Prüfen" : k === "del" ? "Löschen" : k}">${k === "ok" ? "OK" : k === "del" ? "⌫" : k}</button>`).join("");

  $("pad").addEventListener("click", (e) => { const b = e.target.closest("[data-key]"); if (b) type(b.dataset.key); });
  $("rangePad").innerHTML = ["7", "8", "9", "4", "5", "6", "1", "2", "3", "del", "0", "ok"].map((k) =>
    `<button class="key${k === "ok" ? " ok" : k === "del" ? " del" : ""}" type="button" data-key="${k}"
       aria-label="${k === "ok" ? "Weiter" : k === "del" ? "Löschen" : k}">${k === "ok" ? "Weiter" : k === "del" ? "⌫" : k}</button>`).join("");
  $("rangePad").addEventListener("click", (e) => { const b = e.target.closest("[data-key]"); if (b) rangeKey(b.dataset.key); });
  $("grades").addEventListener("click", (e) => {
    const b = e.target.closest("[data-grade]"); if (!b) return;
    state.grade = Number(b.dataset.grade);
    renderSetup();
    setTimeout(setupNext, 250);
  });
  $("malChoice").addEventListener("click", (e) => {
    const b = e.target.closest("[data-mal]"); if (!b) return;
    state.mal = b.dataset.mal === "1";
    renderSetup();
    setTimeout(setupNext, 250);
  });
  $("setupDone").addEventListener("click", finishSetup);
  $("setupBack").addEventListener("click", () => {
    if (setupStep === 0) return goHome();
    setupStep--; renderSetup();
  });
  $("settingsChip").addEventListener("click", () => openSetup(0));
  $("memoryBtn").addEventListener("click", () => { state.level = null; setLevelButtons(); startMemory(); });
  $("pathBtn").addEventListener("click", openPath);
  $("pathBack").addEventListener("click", () => goHome());
  $("pathPlay").addEventListener("click", () => startLevel(pathSel));
  $("path").addEventListener("click", (e) => {
    const b = e.target.closest("[data-level]"); if (!b) return;
    const i = Number(b.dataset.level);
    if (i > state.path.done) {
      renderPath(`Level ${i + 1} ist noch zu. Schaffe erst Level ${state.path.done + 1}, dann geht es weiter!`);
      beeMood("pathBee", "think");
      return;
    }
    pathSel = i;
    renderPath();
    beeMood("pathBee", "happy");
  });
  $("gardenBtn").addEventListener("click", openGarden);
  $("gardenBack").addEventListener("click", () => goHome());
  $("shop").addEventListener("click", (e) => { const b = e.target.closest("[data-buy]"); if (b) buy(b.dataset.buy); });
  $("memAgain").addEventListener("click", startMemory);
  $("memBack").addEventListener("click", leaveGame);
  $("memMenu").addEventListener("click", leaveGame);
  $("memGrid").addEventListener("click", (e) => { const b = e.target.closest("[data-card]"); if (b) flipCard(Number(b.dataset.card)); });

  // Vorlesen: Sprechblasen, Aufgaben und Tipps
  for (const b of document.querySelectorAll(".speak, .speak-task")) {
    if (!canSpeak) { b.hidden = true; continue; }
    b.innerHTML = SPEAKER + b.textContent;
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-speak-el], [data-speak-task], [data-speak-text]");
    if (!b) return;
    if (b.dataset.speakEl) speak($(b.dataset.speakEl).textContent);
    else if (b.dataset.speakText) speak(decodeURIComponent(b.dataset.speakText));
    else if (b.dataset.speakTask === "game" && state.round) speak(spokenTask(state.round.tasks[state.round.i]));
    else if (b.dataset.speakTask === "balloon" && bj.wave) speak(spokenTask(bj.wave.t));
  });

  $("balloonBtn").addEventListener("click", () => { state.level = null; setLevelButtons(); startBalloons(); });
  $("bjAgain").addEventListener("click", startBalloons);
  $("bjBack").addEventListener("click", () => { stopBalloons(); leaveGame(); });
  $("bjMenu").addEventListener("click", leaveGame);
  $("tricksBtn").addEventListener("click", () => openTricks(""));
  $("tricksBack").addEventListener("click", () => { if (tricksFrom === "startView") goHome(); else show(tricksFrom); });
  $("trickNav").addEventListener("click", (e) => {
    const b = e.target.closest("[data-jump]"); if (b) renderTricks(b.dataset.jump);
  });
  $("help").addEventListener("click", (e) => { const b = e.target.closest("[data-tricks]"); if (b) openTricks(b.dataset.tricks); });
  $("topics").addEventListener("click", (e) => {
    const b = e.target.closest("[data-topic]"); if (!b) return;
    const t = b.dataset.topic;
    const all = topicsFor({ N: state.N || 100, mal: state.mal === true });
    if (t === "all") state.topics = all.every((x) => state.topics.includes(x)) ? [] : all;
    else state.topics = state.topics.includes(t) ? state.topics.filter((x) => x !== t) : [...state.topics, t];
    $("topicNote").textContent = "";
    renderSetup();
  });
  $("startBtn").addEventListener("click", () => { state.level = null; setLevelButtons(); startRound(); });
  $("againBtn").addEventListener("click", startRound);
  $("menuBtn").addEventListener("click", leaveGame);
  $("backBtn").addEventListener("click", () => { state.round = null; resetTaskUi(); leaveGame(); });
  $("helpBtn").addEventListener("click", () => { if ($("help").hidden) showHelp(); else $("help").hidden = true; });
  $("nextBtn").addEventListener("click", nextTask);
  $("soundBtn").addEventListener("click", () => { state.sound = !state.sound; store.set("rw-sound", state.sound); renderHeader(); });

  document.addEventListener("keydown", (e) => {
    if (!$("setupView").hidden && setupStep === 1) {
      const k = /^[0-9]$/.test(e.key) ? e.key : e.key === "Backspace" ? "del" : e.key === "Enter" ? "ok" : "";
      if (k) { rangeKey(k); e.preventDefault(); }
      return;
    }
    if ($("gameView").hidden || !state.round) return;
    if (/^[0-9]$/.test(e.key)) { type(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { type("del"); e.preventDefault(); }
    else if (e.key === "Enter") {
      if (!$("nextBtn").hidden) nextTask(); else type("ok");
      e.preventDefault();
    }
  });

  for (const id of ["setupBee", "homeBee", "gameBee", "memBee", "pathBee", "gardenBee"]) $(id).innerHTML = beeSVG();
  $("iconPath").innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 54C24 54 14 36 32 34S44 16 54 14" stroke="var(--sun)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 8"/><circle cx="10" cy="54" r="6" fill="var(--grass)"/><circle cx="32" cy="34" r="6" fill="var(--grass)"/><path d="M54 6V30" stroke="var(--bee-ink)" stroke-width="3"/><path d="M54 6L68 11L54 16Z" fill="var(--red)" transform="translate(-4 0)"/></svg>';
  $("iconGarden").innerHTML = decoSVG("pilz");
  $("iconBalloon").innerHTML = balloonSVG("var(--petal-1)");
  $("iconMemory").innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="12" width="28" height="38" rx="5" fill="var(--grass)" transform="rotate(-10 20 31)"/><rect x="28" y="10" width="28" height="38" rx="5" fill="var(--paper)" stroke="var(--blue)" stroke-width="3" transform="rotate(8 42 29)"/><text x="42" y="36" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18" fill="var(--blue)" transform="rotate(8 42 29)">12</text></svg>';
  $("iconFlower").innerHTML = flowerSVG("flower", "var(--petal-2)");
  $("iconTricks").innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="26" r="17" fill="var(--sun)"/><rect x="24" y="42" width="16" height="10" rx="3" fill="var(--ink-soft)"/><path d="M26 30l6-8 6 8" stroke="var(--sun-ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 4v4M10 26H6M58 26h-4M15 10l3 3M49 10l-3 3" stroke="var(--sun)" stroke-width="3" stroke-linecap="round"/></svg>';
  // Android-Zurück-Taste: einen Schritt zurück statt die App zu schließen
  if (isApp) {
    const appPlugin = cap.registerPlugin("App");
    const BACK = { setupView: "setupBack", gameView: "backBtn", resultView: "menuBtn", tricksView: "tricksBack",
      balloonView: "bjBack", memoryView: "memBack", pathView: "pathBack", gardenView: "gardenBack" };
    appPlugin.addListener("backButton", () => {
      const btn = $(BACK[VIEWS.find((id) => !$(id).hidden)] || "");
      if (btn && !btn.hidden) btn.click();
      else appPlugin.exitApp();
    });
  }

  renderTricks("plus");
