<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- /kopf -->
<title>Rechenwiese</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: eine schmale Spalte wie ein Arbeitsblatt, unten wächst die Wiese mit jeder richtigen Aufgabe */
:root {
  --sky: #e6f2f6;
  --sky-top: #cfe7f1;
  --bee-ink: #3b2f14;
  --wing: #ffffff;
  --paper: #ffffff;
  --ink: #1d3a3c;
  --ink-soft: #557073;
  --line: #c9dfe3;
  --grass: #4f9e45;
  --grass-deep: #2f7a33;
  --stem: #3d8a3a;
  --sun: #f4b329;
  --sun-ink: #4a3300;
  --petal-1: #ef6f9e;
  --petal-2: #8f72dd;
  --petal-3: #f08a3c;
  --petal-4: #3fa7d6;
  --red: #e0453c;
  --blue: #2f6fd6;
  --ok: #2f8a3a;
  --oops: #c4572a;
  --key: #f3f9fa;
  --key-press: #d9ecef;
  --display: "Baloo 2", "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
  --body: "Andika", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  height: 100%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #0f2228; --sky-top: #17323d; --wing: #d8eef5; --paper: #18323a; --ink: #e4f1ee; --ink-soft: #9db8b8; --line: #2c4a52;
    --grass: #4a9542; --grass-deep: #3a7e36; --stem: #5aa651; --sun: #f6c24a; --sun-ink: #2a1d00;
    --petal-1: #f483ad; --petal-2: #a68cf0; --petal-3: #f59a55; --petal-4: #5ab8e3;
    --red: #f06a60; --blue: #6c9cf0; --ok: #6fcf6a; --oops: #f0915f;
    --key: #1f3c45; --key-press: #2b525c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #0f2228; --sky-top: #17323d; --wing: #d8eef5; --paper: #18323a; --ink: #e4f1ee; --ink-soft: #9db8b8; --line: #2c4a52;
  --grass: #4a9542; --grass-deep: #3a7e36; --stem: #5aa651; --sun: #f6c24a; --sun-ink: #2a1d00;
  --petal-1: #f483ad; --petal-2: #a68cf0; --petal-3: #f59a55; --petal-4: #5ab8e3;
  --red: #f06a60; --blue: #6c9cf0; --ok: #6fcf6a; --oops: #f0915f;
  --key: #1f3c45; --key-press: #2b525c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 560px;
  min-height: 100%;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* Kopfzeile */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; margin: 0; letter-spacing: -0.01em; }
.brand span { color: var(--grass-deep); }
.top-right { display: flex; align-items: center; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--paper); border: 2px solid var(--line); border-radius: 999px;
  padding: 4px 12px 4px 6px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.pill svg { width: 22px; height: 30px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--line);
  display: grid; place-items: center; font-size: 15px; font-weight: 700;
}

/* Allgemeine Bausteine */
.sheet { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 18px; }
.label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 700; margin: 0 0 10px; }
h2 { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; margin: 0; text-wrap: balance; }
.muted { color: var(--ink-soft); margin: 0; }

/* Startseite: Klasse wählen */
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.grade {
  border: 3px solid var(--line); background: var(--key); border-radius: 18px;
  padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: transform .12s ease;
}
.grade b { font-family: var(--display); font-size: 40px; line-height: 1; }
.grade small { font-size: 13px; color: var(--ink-soft); }
.grade[aria-pressed="true"] { border-color: var(--grass-deep); background: var(--grass); color: #fff; }
.grade[aria-pressed="true"] small { color: #eaffe6; }
.grade:active { transform: scale(.96); }
.grade-note { margin: 12px 0 0; color: var(--ink-soft); font-size: 16px; }

.topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.topic {
  border: 3px solid var(--line); background: var(--key); border-radius: 16px;
  padding: 10px 12px; display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 10px; text-align: left;
}
.topic .sym {
  width: 44px; height: 44px; border-radius: 12px; background: var(--paper); border: 2px solid var(--line);
  display: grid; place-items: center; font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1;
}
.topic .name { font-weight: 700; line-height: 1.2; overflow-wrap: break-word; }
.topic > span:last-child { min-width: 0; }
.topic .stars { display: block; font-size: 14px; color: var(--sun); letter-spacing: 2px; min-height: 1em; }
.topic .stars.none { color: var(--ink-soft); letter-spacing: 0; font-size: 13px; }
.topic .sym.small { font-size: 16px; letter-spacing: -0.02em; }
.topic[aria-pressed="true"] { border-color: var(--sun); background: var(--paper); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sun) 35%, transparent); }
.topic.wide { grid-column: 1 / -1; }
.topic { position: relative; }
.topic[aria-pressed="true"]::after {
  content: "✓"; position: absolute; top: 6px; right: 10px;
  font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1; color: var(--grass-deep);
}
.topic-hint { margin: -2px 0 12px; color: var(--ink-soft); font-size: 16px; }

.go {
  width: 100%; border: 0; border-radius: 18px; padding: 16px;
  background: var(--sun); color: var(--sun-ink);
  font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--sun) 55%, #000);
  transition: transform .08s ease, box-shadow .08s ease;
}
.go:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--sun) 55%, #000); }
.go.secondary { background: var(--key); color: var(--ink); box-shadow: 0 5px 0 var(--line); border: 2px solid var(--line); font-size: 22px; }

/* Einrichtung */
.yesno { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { border: 3px solid var(--line); background: var(--key); border-radius: 16px; padding: 12px; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; }
.choice[aria-pressed="true"] { border-color: var(--grass-deep); background: var(--grass); color: #fff; }

.steps { display: flex; justify-content: center; gap: 8px; }
.steps span { width: 12px; height: 12px; border-radius: 6px; background: var(--line); transition: width .2s; }
.steps span.on { width: 30px; background: var(--grass); }
.range-display { display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--display); font-weight: 800; font-size: 30px; }
.range-display .slot { font-size: 46px; min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
.setup-note { margin: 10px 0 12px; text-align: center; color: var(--ink-soft); font-size: 16px; }
.setup-note.bad { color: var(--oops); font-weight: 700; }
.setup-back { justify-self: start; }

/* Summi, die Rechenbiene */
.hello { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; padding: 14px; }
.bee { width: 84px; height: 78px; }
.bee svg { width: 100%; height: 100%; overflow: visible; }
.bee .float { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 60%; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(-3deg); } }
.bee.happy .float { animation: hop .55s ease 2; }
@keyframes hop { 40% { transform: translateY(-14px) rotate(8deg); } }
.bee.think .float { animation: none; transform: rotate(-12deg); }
.bubble { position: relative; background: var(--sky); border-radius: 18px; padding: 10px 14px; display: grid; gap: 8px; justify-items: start; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-left: 0; border-right-color: var(--sky); }
.bubble p { margin: 0; font-weight: 700; font-size: 19px; line-height: 1.35; }
.speak { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 12px 3px 8px; font-weight: 700; font-size: 15px; }
.speak svg, .speak-task svg { width: 18px; height: 18px; flex: none; }
.speak-task { display: inline-flex; align-items: center; gap: 6px; }
.hello.mini { grid-template-columns: 52px 1fr; padding: 0; margin-top: 12px; gap: 8px; }
.hello.mini .bee { width: 52px; height: 48px; }
.hello.mini .say { margin: 0; text-align: left; min-height: 0; font-size: 19px; }

/* Startseite */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode {
  border: 3px solid var(--line); background: var(--paper); border-radius: 22px; padding: 14px 10px 12px;
  display: grid; justify-items: center; align-content: start; gap: 4px; text-align: center;
  box-shadow: 0 5px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease;
}
.mode:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.mode svg { width: 64px; height: 64px; }
.mode b { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; }
.mode small { color: var(--ink-soft); font-size: 14px; line-height: 1.25; }
.mode .tag { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--blue); }
.mode.game { background: color-mix(in srgb, var(--blue) 10%, var(--paper)); border-color: color-mix(in srgb, var(--blue) 40%, var(--line)); box-shadow: 0 5px 0 color-mix(in srgb, var(--blue) 40%, var(--line)); }
.settings-chip {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
  border: 2px dashed var(--line); background: transparent; border-radius: 16px; padding: 10px 14px; font-size: 15px; color: var(--ink-soft);
}
.settings-chip b { color: var(--blue); white-space: nowrap; }

.mode.wide { grid-column: 1 / -1; }
.mode.adventure { background: color-mix(in srgb, var(--sun) 18%, var(--paper)); border-color: color-mix(in srgb, var(--sun) 60%, var(--line)); box-shadow: 0 5px 0 color-mix(in srgb, var(--sun) 60%, var(--line)); }
.mode.adventure .tag { color: var(--ink-soft); }
.mode.garden-tile { background: color-mix(in srgb, var(--grass) 12%, var(--paper)); border-color: color-mix(in srgb, var(--grass) 45%, var(--line)); box-shadow: 0 5px 0 color-mix(in srgb, var(--grass) 45%, var(--line)); }
.mode.garden-tile .tag { color: var(--grass-deep); }

/* Abenteuer-Pfad */
.path { position: relative; margin: 0 4px; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; }
.trail polyline { fill: none; stroke: var(--line); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-dasharray: 2 16; }
.trail polyline.walked { stroke: var(--sun); stroke-dasharray: none; stroke-width: 8; }
.node {
  position: absolute; transform: translate(-50%, -50%); width: 68px; height: 68px; border-radius: 50%;
  border: 4px solid var(--line); background: var(--key); display: grid; place-items: center;
  font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; color: var(--ink);
}
.node svg { width: 26px; height: 26px; }
.node.done { background: var(--grass); border-color: var(--grass-deep); color: #fff; }
.node.now { background: var(--sun); border-color: color-mix(in srgb, var(--sun) 55%, #000); color: var(--sun-ink); animation: pulse2 1.1s ease-in-out infinite alternate; }
@keyframes pulse2 { to { box-shadow: 0 0 0 10px color-mix(in srgb, var(--sun) 30%, transparent); } }
.node.locked { color: var(--ink-soft); }
.node.boss { width: 82px; height: 82px; }
.node[aria-pressed="true"] { outline: 4px solid var(--blue); outline-offset: 4px; }
.nstars { position: absolute; top: -18px; left: 50%; translate: -50% 0; color: var(--sun); font-size: 15px; letter-spacing: 1px; white-space: nowrap; text-shadow: 0 1px 0 var(--paper); }
.nlabel { position: absolute; top: 100%; left: 50%; translate: -50% 0; margin-top: 6px; display: grid; justify-items: center; white-space: nowrap; font-family: var(--body); font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.15; }
.nlabel small { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.path-bee { position: absolute; width: 56px; height: 52px; pointer-events: none; }

/* Mein Garten und Gartenladen */
.scene {
  position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 22px; overflow: hidden; border: 2px solid var(--line);
  background: linear-gradient(to bottom, var(--sky-top) 0%, var(--paper) 52%, var(--grass) 52%, var(--grass-deep) 100%);
}
.scene .deco, .scene .fl { position: absolute; }
.scene svg { display: block; width: 100%; height: auto; }
.scene .fly { animation: flutter 3s ease-in-out infinite; }
@keyframes flutter { 50% { transform: translate(10px, -8px) rotate(6deg); } }
.scene .sun { position: absolute; right: 5%; top: 6%; width: 14%; aspect-ratio: 1; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 8px color-mix(in srgb, var(--sun) 25%, transparent); }
.shop { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.shop-item { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 12px 10px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.shop-item.owned { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--paper)); }
.shop-icon { width: 64px; height: 64px; display: grid; place-items: center; }
.shop-icon svg { max-width: 100%; max-height: 100%; }
.shop-item b { font-family: var(--display); font-size: 19px; line-height: 1.1; }
.buy { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 999px; padding: 6px 16px 6px 10px; background: var(--sun); color: var(--sun-ink); font-family: var(--display); font-weight: 800; font-size: 19px; box-shadow: 0 3px 0 color-mix(in srgb, var(--sun) 55%, #000); }
.buy svg { width: 16px; height: 24px; }
.buy:disabled { background: var(--key); color: var(--ink-soft); box-shadow: 0 3px 0 var(--line); cursor: default; }
.shop-item small { color: var(--ink-soft); font-size: 13px; }
.have { color: var(--ok); font-weight: 700; }

/* Zahlen-Memory */
.memory { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 520px) { .memory { grid-template-columns: repeat(4, 1fr); } }
.card { aspect-ratio: 1; max-width: 100%; border: 0; padding: 0; background: none; perspective: 600px; }
.card .in { position: relative; display: block; width: 100%; height: 100%; transition: transform .35s ease; transform-style: preserve-3d; }
.card.open .in, .card.done .in { transform: rotateY(180deg); }
.card .face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 3px solid var(--line); padding: 6px; text-align: center; }
.card .back { background: var(--grass); border-color: var(--grass-deep); }
.card .back svg { width: 46%; height: auto; }
.card .front { background: var(--paper); transform: rotateY(180deg); font-family: var(--display); font-weight: 800; font-size: clamp(17px, 5vw, 24px); line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card .front.ans { color: var(--blue); font-size: clamp(24px, 7vw, 34px); }
.card.done .front { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--paper)); }

/* Rechentricks */
.trick-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.trick-nav button { flex: none; }
.trick-nav button { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 16px; }
.trick-nav button[aria-pressed="true"] { background: var(--grass); border-color: var(--grass-deep); color: #fff; }
.trick-group { display: grid; gap: 12px; scroll-margin-top: 12px; }
.trick { display: grid; gap: 10px; }
.trick h3 { font-family: var(--display); font-weight: 800; font-size: 21px; margin: 0; line-height: 1.15; text-wrap: balance; }
.trick p { margin: 0; }
.trick ol { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }
.trick .pic { justify-self: center; max-width: 100%; overflow-x: auto; }
.example { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.3; background: var(--sky); border-radius: 12px; padding: 8px 14px; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.signal { display: grid; grid-template-columns: 2.2em 1fr; gap: 6px 10px; align-items: center; }
.signal b { font-family: var(--display); font-size: 26px; color: var(--grass-deep); text-align: center; line-height: 1; }
.more-tricks { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* Ballonjagd */
.hearts { color: var(--red); font-size: 20px; letter-spacing: 2px; white-space: nowrap; }
.hearts .lost { color: var(--line); }
.bj-task { padding: 14px 12px 10px; }
.bj-task .task { font-size: clamp(32px, 9vw, 52px); }
.bj-task .task.is-text { font-size: 19px; }
.bj-task .say { margin-top: 6px; font-size: 17px; min-height: 0; }
.bj-task .task.is-text { gap: 8px; }
.bj-task .task.is-text .answer { display: none; }   /* die Antwort sind die Ballons */
.bj-task .dienes { height: 56px; }
.bar .icon-btn.speak-task { flex: none; font-size: 0; gap: 0; }
.bar .icon-btn.speak-task svg { width: 20px; height: 20px; }
.sky {
  position: relative; height: clamp(300px, 50vh, 520px); border-radius: 22px; overflow: hidden; border: 2px solid var(--line);
  background: linear-gradient(to bottom, var(--sky-top) 0%, var(--paper) 93%, var(--grass) 93%);
}
.balloon { position: absolute; left: 0; top: 0; border: 0; background: none; padding: 0; aspect-ratio: 2 / 3; will-change: transform; }
.balloon svg { width: 100%; height: 100%; display: block; }
.balloon span {
  position: absolute; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none;
  font-family: var(--display); font-weight: 800; font-size: 26px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5);
  font-variant-numeric: tabular-nums;
}
.balloon.popped { animation: popout .3s forwards; pointer-events: none; }
@keyframes popout { to { scale: 1.6; opacity: 0; } }
.balloon.wrong { filter: grayscale(1); opacity: .45; pointer-events: none; }
.level-up { position: absolute; inset: 38% 0 auto; text-align: center; font-family: var(--display); font-weight: 800; font-size: 34px; pointer-events: none; animation: grow .5s cubic-bezier(.3,1.6,.5,1); }

/* Garten */
.garden {
  position: relative; min-height: 96px; border-radius: 18px; overflow: hidden;
  background: linear-gradient(to bottom, transparent 70%, var(--grass) 70%);
  border: 2px solid var(--line);
  display: flex; align-items: flex-end; flex-wrap: wrap; gap: 0 2px; padding: 6px 10px 0;
}
.garden svg { width: 28px; height: 42px; margin-bottom: 6px; }
.garden .empty { position: absolute; inset: 10px 14px auto; font-size: 15px; color: var(--ink-soft); margin: 0; }

/* Spiel */
.bar { display: flex; align-items: center; gap: 10px; }
.back { border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 6px 12px; font-weight: 700; white-space: nowrap; flex: none; }
.count { white-space: nowrap; }
.where { font-weight: 700; color: var(--ink-soft); flex: 1; min-width: 0; font-size: 15px; line-height: 1.25; }
.count { font-variant-numeric: tabular-nums; font-weight: 700; }

.task-card { text-align: center; padding: 26px 12px 18px; position: relative; }
.task {
  font-family: var(--display); font-weight: 800; font-size: clamp(40px, 11vw, 64px); line-height: 1.1;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 .25em;
  font-variant-numeric: tabular-nums;
}
.task .op { color: var(--grass-deep); }
.slot {
  min-width: 1.8em; padding: 0 .2em; border-radius: 14px; border: 4px dashed var(--line);
  background: var(--sky); color: var(--ink); display: inline-block;
}
.slot.filled { border-style: solid; border-color: var(--blue); }
.slot.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, var(--paper)); }
.slot.wrong { border-color: var(--oops); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.task.is-text { display: grid; justify-items: center; gap: 14px; font-family: var(--body); font-weight: 700; font-size: 22px; line-height: 1.35; }
.task .story { margin: 0; max-width: 30ch; text-wrap: balance; }
.task .answer { display: flex; align-items: center; gap: .3em; font-family: var(--display); font-size: clamp(36px, 9vw, 52px); font-weight: 800; }
.task .unit { font-family: var(--body); font-size: 20px; color: var(--ink-soft); }
.task .pic { max-width: 100%; overflow-x: auto; }
.dienes { display: block; height: 80px; max-width: 100%; }
.tafel { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 0 auto; }
.tafel th, .tafel td { border: 2px solid var(--line); padding: 4px 10px; text-align: center; }
.tafel th { background: var(--key); font-family: var(--body); font-size: 15px; color: var(--ink-soft); }
.tafel td { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.2; min-width: 1.6em; }
/* Nichts in einer Aufgabe darf die Seite breiter machen als den Bildschirm */
main > *, .task-card, .help, .task .pic { min-width: 0; max-width: 100%; }
.help > * { max-width: 100%; }
.help .tafel, .help .dienes { overflow-x: auto; }
.streak { background: var(--sun); color: var(--sun-ink); border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.streak.pop { animation: grow .5s cubic-bezier(.3,1.6,.5,1); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.say { min-height: 1.5em; margin: 14px 0 0; font-weight: 700; font-size: 20px; }
.say.ok { color: var(--ok); }
.say.oops { color: var(--oops); }
.task-tools { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.tool { border: 2px solid var(--line); background: var(--key); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 16px; }

.help { margin-top: 14px; display: grid; justify-items: center; gap: 8px; }
.help p { margin: 0; font-size: 17px; max-width: 34ch; }
.field20 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; width: min(100%, 360px); }
.field20 .cell { aspect-ratio: 1; max-width: 100%; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; }
.field20 .cell:nth-child(5n) { margin-right: 6px; }
.dot { width: 76%; aspect-ratio: 1; border-radius: 50%; }
.dot.r { background: var(--red); }
.dot.b { background: var(--blue); }
.dot.gone { position: relative; opacity: .35; }
.dot.gone::after { content: ""; position: absolute; left: -10%; right: -10%; top: 45%; height: 3px; background: var(--ink); transform: rotate(-35deg); }
.array { display: grid; gap: 4px; }
.array .dot { width: 16px; }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key {
  border: 2px solid var(--line); background: var(--paper); border-radius: 16px;
  min-height: 60px; font-family: var(--display); font-size: 30px; font-weight: 800;
  box-shadow: 0 4px 0 var(--line); transition: transform .06s ease, box-shadow .06s ease;
}
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); background: var(--key-press); }
.key.ok { background: var(--grass); border-color: var(--grass-deep); color: #fff; box-shadow: 0 4px 0 var(--grass-deep); }
.key.del { font-size: 22px; }
.key:disabled { opacity: .5; }

.meadow {
  display: grid; grid-template-columns: repeat(10, 1fr); align-items: end;
  height: 72px; padding: 0 6px; border-radius: 16px;
  background: linear-gradient(to bottom, transparent 62%, var(--grass) 62%);
  border: 2px solid var(--line);
}
.meadow .spot { display: grid; place-items: end center; height: 100%; }
.meadow .spot > div { width: 100%; display: grid; place-items: end center; }
.meadow .spot svg { width: 30px; max-width: 100%; height: 52px; margin-bottom: 4px; }
.meadow .spot.now::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--sun); margin-bottom: 8px; animation: pulse 1s infinite alternate; }
@keyframes pulse { to { transform: scale(1.5); } }
.grow { transform-origin: 50% 100%; animation: grow .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes grow { from { transform: scale(0); } }

/* Ergebnis */
.result { text-align: center; display: grid; gap: 14px; justify-items: center; }
.big-stars { display: flex; gap: 8px; }
.big-stars svg { width: 64px; height: 64px; }
.big-stars .off path { fill: var(--line); }
.big-stars .on path { fill: var(--sun); }
.result .actions { display: grid; gap: 14px; width: 100%; }
.tally { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-weight: 700; }
.tally span { display: flex; align-items: center; gap: 4px; }
.tally svg { width: 22px; height: 32px; }

.foot { margin-top: auto; text-align: center; font-size: 14px; color: var(--ink-soft); }

@media (max-width: 420px) {
  .tafel th, .tafel td { padding: 3px 6px; }
  .tafel th { font-size: 13px; }
  .tafel td { font-size: 24px; min-width: 1.2em; }
  .grade b { font-size: 34px; }
  .grade small { font-size: 11px; }
  .topic { grid-template-columns: 38px 1fr; padding: 8px 10px; }
  .topic .sym { width: 38px; height: 38px; font-size: 24px; }
  .topic .name { font-size: 16px; }
  .key { min-height: 56px; }
}
@media (max-width: 360px) {
  .topic { grid-template-columns: 1fr; justify-items: start; gap: 6px; }
  .topic .sym { width: 34px; height: 34px; font-size: 22px; }
  .topic .sym.small { font-size: 14px; }
  .bar { gap: 6px; }
  .back { padding: 6px 9px; }
  .hearts { font-size: 16px; letter-spacing: 0; }
  .brand { font-size: 25px; }
  .top-right { gap: 6px; }
  .pill { padding-right: 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
(() => {
  "use strict";

  // ---------- Hilfsfunktionen ----------
  const $ = (id) => document.getElementById(id);
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const fmt = (n) => n.toLocaleString("de-DE");
  const rangeLabel = (n) => (n === 1000000 ? "1 Mio." : fmt(n));

  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* Speicher nicht verfügbar */ }
    },
  };

  // ---------- Blumen ----------
  const PETALS = ["var(--petal-1)", "var(--petal-2)", "var(--petal-3)", "var(--petal-4)"];
  function flowerSVG(kind, color, center = "var(--sun)") {
    if (kind === "gold") { color = "var(--sun)"; center = "var(--petal-3)"; }
    const stem = '<path d="M20 58V26" stroke="var(--stem)" stroke-width="3" stroke-linecap="round" fill="none"/>' +
      '<path d="M20 46c-7-1-11-6-11-11 7 0 11 4 11 9z" fill="var(--grass-deep)"/>';
    if (kind === "sprout") {
      return '<svg viewBox="0 0 40 60" aria-hidden="true"><path d="M20 58V44" stroke="var(--stem)" stroke-width="3" stroke-linecap="round"/>' +
        '<path d="M20 48c-6 0-9-4-9-8 6 0 9 4 9 8zM20 48c6 0 9-4 9-8-6 0-9 4-9 8z" fill="var(--grass-deep)"/></svg>';
    }
    if (kind === "bud") {
      return '<svg viewBox="0 0 40 60" aria-hidden="true">' + stem +
        `<ellipse cx="20" cy="22" rx="6" ry="9" fill="${color}"/><path d="M14 26c2 4 10 4 12 0" fill="var(--grass-deep)"/></svg>`;
    }
    let petals = "";
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      petals += `<circle cx="${(20 + Math.cos(a) * 8).toFixed(1)}" cy="${(20 + Math.sin(a) * 8).toFixed(1)}" r="6.5" fill="${color}"/>`;
    }
    return `<svg viewBox="0 0 40 60" aria-hidden="true">${stem}${petals}<circle cx="20" cy="20" r="5.5" fill="${center}"/></svg>`;
  }
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';

  // ---------- Lehrplan & Aufgaben ----------
  const TOPICS = {
    plus:    { name: "Plus",            sym: "+" },
    minus:   { name: "Minus",           sym: "−" },
    mal:     { name: "Mal",             sym: "·" },
    geteilt: { name: "Geteilt",         sym: ":" },
    stellen: { name: "Zehner & Einer",  sym: "ZE", small: true },
    text:    { name: "Text\u00ADaufgaben",    sym: "Abc", small: true },
    luecke:  { name: "Lücken\u00ADaufgaben",  sym: "□" },
    all:     { name: "Alles mischen",   sym: "★" },
  };

  // Die Klasse gibt nur Beispiele vor. Zahlenraum und Mal/Geteilt wählt das Kind selbst.
  const GRADES = {
    1: { example: "z. B. 20" },
    2: { example: "z. B. 100" },
    3: { example: "z. B. 1000" },
    4: { example: "z. B. 1000000" },
  };
  const MIN_N = 10, MAX_N = 1000000;

  // cfg = { N: größte Zahl, mal: Mal und Geteilt schon gelernt? }
  const opsFor = (cfg) => (cfg.mal ? ["plus", "minus", "mal", "geteilt"] : ["plus", "minus"]);
  const topicsFor = (cfg) => [...opsFor(cfg), ...(cfg.N >= 20 ? ["stellen"] : []), "text", "luecke"];
  // Name einer Auswahl, z. B. "Plus" oder "Mix: Plus, Minus, Mal"
  const selectionName = (sel, N) => (sel.length === 1 ? topicName(sel[0], N)
    : sel.length === 2 ? sel.map((t) => topicName(t, N)).join(" + ") : "Bunt gemischt");
  const selectionKey = (sel) => [...sel].sort().join("+");
  const topicName = (t, N) => (t === "stellen" && N > 100 ? "Stellen\u00ADwerte" : TOPICS[t].name);
  const topicSym = (t, N) => (t === "stellen" && N > 100 ? "HZE" : TOPICS[t].sym);

  function noteFor(N) {
    const lead = `Wir rechnen bis ${fmt(N)}. `;
    if (N <= 10) return lead + "Kleine Zahlen, gut für den Anfang.";
    if (N <= 20) return lead + "Die Hilfe zeigt dir das Zwanzigerfeld.";
    if (N <= 100) return lead + "Mit Zehnern und Einern.";
    if (N <= 1000) return lead + "Mit Hundertern, Zehnern und Einern.";
    return lead + "Große Zahlen! Runde Zahlen kannst du gut im Kopf rechnen.";
  }

  // Eine Aufgabe: a op b = c. "blank" sagt, welche Zahl gesucht ist.
  const mk = (a, op, b, c, blank = "c") => ({ a, op, b, c, blank, answer: { a, b, c }[blank] });

  // Rundungsstufen: In großen Zahlenräumen sind runde Zahlen im Kopf gut lösbar.
  function steps(N) {
    if (N <= 100) return [1];
    if (N <= 10000) return [1, 10, 10, 100];
    if (N <= 100000) return [10, 100, 1000, 1000];
    return [100, 1000, 1000, 10000];
  }

  // Plus: a + b = c mit c ≤ N
  function plusTask(N) {
    for (;;) {
      let a, b;
      if (N <= 20) { a = R(1, N - 1); b = R(1, N - a); return mk(a, "+", b, a + b); }
      const s = pick(steps(N));
      a = Math.round(R(Math.ceil(N * 0.05), Math.floor(N * 0.85)) / s) * s;
      b = Math.random() < 0.35 ? R(2, 9) * s : Math.round(R(Math.ceil(N * 0.05), N - a) / s) * s;
      if (a >= 1 && b >= 1 && a + b <= N) return mk(a, "+", b, a + b);
    }
  }

  // Minus ist die Umkehrung einer Plusaufgabe: c − b = a
  function minusTask(N) {
    const t = plusTask(N);
    return mk(t.c, "−", t.b, t.a);
  }

  // Mal: das größere Ergebnis bleibt im Zahlenraum. b ist der kleine Faktor.
  function malTask(N) {
    const tiers = [() => [R(1, 10), R(1, 10)]];
    if (N >= 500) tiers.push(() => [R(2, 9) * 10, R(2, 9)], () => [R(11, 99), R(2, 9)]);
    if (N >= 10000) tiers.push(() => [R(101, 999), R(2, 9)], () => [R(2, 99), pick([10, 100])], () => [R(2, 9) * 100, R(2, 9)]);
    if (N >= 100000) tiers.push(() => [R(1001, 9999), R(2, 9)], () => [R(2, 99) * 100, pick([10, 100])], () => [R(2, 9) * 1000, R(2, 9)]);
    if (N >= 1000000) tiers.push(() => [R(11, 99) * 1000, R(2, 9)], () => [R(2, 9) * 10000, R(2, 9)], () => [R(101, 999), 1000]);
    for (;;) {
      // Neuere, schwierigere Aufgabenarten etwas häufiger ziehen
      const gen = Math.random() < 0.6 ? tiers[tiers.length - 1 - Math.floor(Math.random() * Math.min(3, tiers.length))] : pick(tiers);
      const [a, b] = gen();
      if (a * b <= N && a * b >= 2) return mk(a, "·", b, a * b);
    }
  }

  // Geteilt ist die Umkehrung einer Malaufgabe: c : b = a
  function geteiltTask(N) {
    const t = malTask(N);
    if (t.b === 1 && t.a > 1) return mk(t.c, ":", t.a, t.b);
    return mk(t.c, ":", t.b, t.a);
  }

  const MAKERS = { plus: plusTask, minus: minusTask, mal: malTask, geteilt: geteiltTask };

  // ---------- Zehner & Einer / Stellenwerte ----------
  const PLACES = [["E", "Einer"], ["Z", "Zehner"], ["H", "Hunderter"], ["T", "Tausender"], ["ZT", "Zehntausender"], ["HT", "Hunderttausender"]];

  // Zehnersystem-Material: Hunderterplatten, Zehnerstangen, Einerwürfel
  function dienes(n) {
    const h = Math.floor(n / 100), z = Math.floor(n / 10) % 10, e = n % 10;
    const grid = (w, ht, cols, rows) => {
      let d = "";
      for (let i = 1; i < cols; i++) d += `M${i * 5} 0v${ht}`;
      for (let j = 1; j < rows; j++) d += `M0 ${j * 5}h${w}`;
      return d;
    };
    let x = 0, out = "";
    for (let i = 0; i < h; i++) {
      out += `<g transform="translate(${x} 0)"><rect width="50" height="50" rx="1" fill="var(--petal-2)"/><path d="${grid(50, 50, 10, 10)}" stroke="var(--paper)" stroke-width=".6"/></g>`;
      x += 56;
    }
    if (h) x += 6;
    for (let i = 0; i < z; i++) {
      out += `<g transform="translate(${x} 0)"><rect width="5" height="50" rx="1" fill="var(--blue)"/><path d="${grid(5, 50, 1, 10)}" stroke="var(--paper)" stroke-width=".6"/></g>`;
      x += 9;
    }
    if (z) x += 8;
    for (let i = 0; i < e; i++) {
      out += `<rect x="${x + Math.floor(i / 5) * 9}" y="${45 - (i % 5) * 9}" width="5" height="5" rx="1" fill="var(--red)"/>`;
    }
    if (e) x += Math.ceil(e / 5) * 9;
    return `<svg class="dienes" viewBox="-2 -2 ${x + 4} 54" aria-hidden="true">${out}</svg>`;
  }

  function tafel(n, k) {
    const heads = PLACES.slice(0, k).reverse();
    const digits = String(n).padStart(k, "0").split("");
    return `<table class="tafel"><tr>${heads.map((p) => `<th title="${p[1]}">${p[0]}</th>`).join("")}</tr>` +
      `<tr>${digits.map((d) => `<td>${d}</td>`).join("")}</tr></table>`;
  }

  function placeTask(N) {
    const k = String(N - 1).length;            // Anzahl der Stellen im Zahlenraum
    const n = R(10 ** (k - 1), N - 1);
    const digits = String(n).split("").map(Number);
    const heads = PLACES.slice(0, k).reverse();
    const values = digits.map((d, i) => d * 10 ** (k - 1 - i));
    const variants = ["tafel", "ziffer", "zerlegen"];
    if (N <= 1000) variants.push("bild", "bild");
    if (N <= 100) variants.push("ze", "ze");
    let v = pick(variants);
    const nonZero = values.map((_, i) => i).filter((i) => values[i] > 0);
    if (v === "zerlegen" && nonZero.length < 2) v = "tafel";

    if (v === "bild") {
      return { kind: "text", key: "b" + n, pic: dienes(n), text: "Welche Zahl ist das?", answer: n, helpPic: tafel(n, k),
        tip: n >= 100 ? "Eine Platte sind 100, eine Stange sind 10, ein Würfel ist 1. Zähle erst die Hunderter, dann die Zehner, dann die Einer."
                      : "Eine Stange sind 10 Einer, also 1 Zehner. Zähle erst die Stangen, dann die Würfel." };
    }
    if (v === "tafel") {
      return { kind: "text", key: "t" + n, pic: tafel(n, k), text: "Welche Zahl steht in der Stellenwerttafel?", answer: n,
        tip: "Lies die Ziffern von links nach rechts. Eine 0 bleibt als Platzhalter stehen." };
    }
    if (v === "ze") {
      const [z, e] = digits;
      return { kind: "parts", key: "ze" + n, parts: [`${z} Z`, "+", `${e} E`, "=", "§"], answer: n, helpPic: dienes(n),
        tip: `${z} Zehner sind ${z * 10}. Dazu kommen ${e} Einer.` };
    }
    if (v === "ziffer") {
      const i = R(0, k - 1);
      const text = k === 2 ? `Wie viele ${heads[i][1]} hat die Zahl ${fmt(n)}?`
                           : `Welche Ziffer steht in der Zahl ${fmt(n)} an der ${heads[i][1]}stelle?`;
      return { kind: "text", key: "z" + n + i, text, answer: digits[i], helpPic: N <= 100 ? dienes(n) : tafel(n, k),
        tip: k === 2 ? `${fmt(n)} sind ${digits[0]} Zehner und ${digits[1]} Einer.` : "Die Stellen von rechts nach links: Einer, Zehner, Hunderter, Tausender …" };
    }
    // zerlegen: 47 = 40 + ?
    const miss = pick(nonZero);
    const parts = [fmt(n), "="];
    values.forEach((x, i) => {
      if (!x) return;
      if (parts.length > 2) parts.push("+");
      parts.push(i === miss ? "§" : fmt(x));
    });
    return { kind: "parts", key: "x" + n + miss, parts, answer: values[miss], helpPic: tafel(n, k),
      tip: "Zerlege die Zahl in ihre Stellen. Die Stellenwerttafel hilft dir." };
  }

  // ---------- Textaufgaben ----------
  const NAMES = ["Mia", "Ben", "Lena", "Emil", "Noah", "Emma", "Paul", "Lina", "Ali", "Sofia", "Finn", "Ella"];
  const ITEMS = [
    { w: "Murmeln", give: "verschenkt {n}" }, { w: "Äpfel", give: "verkauft {n}" }, { w: "Aufkleber", give: "verschenkt {n}" },
    { w: "Bonbons", give: "isst {n}" }, { w: "Muscheln", give: "verliert {n}" },
  ];
  const BIG_ITEMS = [{ w: "Punkte", give: "verliert {n} Punkte" }, { w: "Euro", give: "gibt {n} Euro aus" }];

  // Jede Vorlage bekommt eine passende Rechnung t (a op b = c) und die Umgebung s.
  const STORIES = {
    plus: [
      (t) => ({ text: `Wenn du zu meiner Zahl ${fmt(t.b)} dazuzählst, kommt ${fmt(t.c)} heraus. Welche Zahl bin ich?`, answer: t.a, tip: `Rechne rückwärts: ${fmt(t.c)} − ${fmt(t.b)}.` }),
      (t) => ({ text: `Ich bin um ${fmt(t.b)} größer als ${fmt(t.a)}. Welche Zahl bin ich?`, answer: t.c, tip: `Größer heißt plus: ${fmt(t.a)} + ${fmt(t.b)}.` }),
      (t, s) => ({ text: `${s.name} hat ${fmt(t.a)} ${s.item.w} und bekommt ${fmt(t.b)} dazu. Wie viele ${s.item.w} hat ${s.name} jetzt?`, answer: t.c, unit: s.item.w, tip: `Dazubekommen heißt plus: ${fmt(t.a)} + ${fmt(t.b)}.` }),
    ],
    minus: [
      (t) => ({ text: `Wenn du von meiner Zahl ${fmt(t.b)} wegnimmst, bleiben ${fmt(t.a)} übrig. Welche Zahl bin ich?`, answer: t.c, tip: `Rechne rückwärts: ${fmt(t.a)} + ${fmt(t.b)}.` }),
      (t) => ({ text: `Ich bin um ${fmt(t.b)} kleiner als ${fmt(t.c)}. Welche Zahl bin ich?`, answer: t.a, tip: `Kleiner heißt minus: ${fmt(t.c)} − ${fmt(t.b)}.` }),
      (t, s) => ({ text: `${s.name} hat ${fmt(t.c)} ${s.item.w} und ${s.item.give.replace("{n}", fmt(t.b))}. Wie viele ${s.item.w} hat ${s.name} noch?`, answer: t.a, unit: s.item.w, tip: `Weggeben heißt minus: ${fmt(t.c)} − ${fmt(t.b)}.` }),
      (t, s) => ({ text: `${s.name} hat ${fmt(t.a)} ${s.item.w} und möchte ${fmt(t.c)} haben. Wie viele fehlen noch?`, answer: t.b, unit: s.item.w, tip: `Wie viel fehlt von ${fmt(t.a)} bis ${fmt(t.c)}? Rechne ${fmt(t.c)} − ${fmt(t.a)}.` }),
    ],
    mal: [
      (t) => ({ text: `Wenn du meine Zahl mal ${fmt(t.b)} nimmst, kommt ${fmt(t.c)} heraus. Welche Zahl bin ich?`, answer: t.a, tip: `Rechne rückwärts: ${fmt(t.c)} : ${fmt(t.b)}.` }),
      (t, s) => (s.small && t.a <= 10 && t.b <= 10
        ? { text: `In jeder Tüte sind ${t.b} ${s.item.w}. ${s.name} hat ${t.a} Tüten. Wie viele ${s.item.w} sind das zusammen?`, answer: t.c, unit: s.item.w, tip: `${t.a} Tüten mit je ${t.b}: Rechne ${t.a} · ${t.b}.` }
        : null),
      (t, s) => (2 * t.c <= s.N ? { text: `Ich bin das Doppelte von ${fmt(t.c)}. Welche Zahl bin ich?`, answer: 2 * t.c, tip: `Das Doppelte heißt mal 2: ${fmt(t.c)} + ${fmt(t.c)}.` } : null),
      (t) => (t.c % 2 === 0 ? { text: `Ich bin die Hälfte von ${fmt(t.c)}. Welche Zahl bin ich?`, answer: t.c / 2, tip: `Die Hälfte heißt geteilt durch 2: ${fmt(t.c)} : 2.` } : null),
    ],
    geteilt: [
      (t) => ({ text: `Wenn du meine Zahl durch ${fmt(t.b)} teilst, kommt ${fmt(t.a)} heraus. Welche Zahl bin ich?`, answer: t.c, tip: `Rechne rückwärts: ${fmt(t.a)} · ${fmt(t.b)}.` }),
      (t, s) => (s.small && t.b >= 2 && t.b <= 10
        ? { text: `${fmt(t.c)} ${s.item.w} werden gerecht an ${t.b} Kinder verteilt. Wie viele ${s.item.w} bekommt jedes Kind?`, answer: t.a, unit: s.item.w, tip: `Gerecht verteilen heißt teilen: ${fmt(t.c)} : ${t.b}.` }
        : null),
    ],
  };

  function textTask(cfg, ops) {
    const N = cfg.N;
    for (;;) {
      const op = pick(ops);
      const t = (op === "minus" ? plusTask : op === "geteilt" ? malTask : MAKERS[op])(N);
      const s = { N, small: N <= 100, name: pick(NAMES), item: pick(N <= 100 ? ITEMS : BIG_ITEMS) };
      const made = pick(STORIES[op])(t, s);
      if (!made || made.answer < 1 || made.answer > N) continue;
      if (made.unit && Math.min(t.a, t.b, t.c) < 2) continue;   // "1 Murmeln" vermeiden
      return { kind: "text", key: made.text, ...made, topic: "text" };
    }
  }

  // sel = alle gewählten Themen. Sind Rechenarten dabei, nutzen Text- und Lückenaufgaben nur diese.
  function generate(cfg, topic, sel = [topic]) {
    const N = cfg.N;
    const chosenOps = sel.filter((t) => opsFor(cfg).includes(t));
    const basic = chosenOps.length ? chosenOps : opsFor(cfg);
    if (topic === "stellen") return { ...placeTask(N), topic };
    if (topic === "text") return textTask(cfg, basic);
    if (topic !== "luecke") return { ...MAKERS[topic](N), topic };
    // Lückenaufgabe: eine bekannte Aufgabe nehmen und eine Zahl verstecken
    const t = MAKERS[pick(basic)](N);
    t.topic = "luecke";
    t.blank = pick(["a", "b"]);
    t.answer = t[t.blank];
    return t;
  }

  function makeRound(cfg, sel) {
    const seen = new Set();
    const list = [];
    let guard = 0;
    while (list.length < 10 && guard++ < 500) {
      const t = generate(cfg, pick(sel), sel);
      const key = t.key || `${t.a}${t.op}${t.b}${t.blank}`;
      if (seen.has(key)) continue;
      seen.add(key);
      list.push(t);
    }
    return list;
  }

  // ---------- Zustand ----------
  const state = {
    grade: null,                          // wird beim Start gefragt
    topics: [],                           // gewählte Themen, mehrere werden gemischt
    N: null,                              // wird jedes Mal neu eingetippt
    mal: null,                            // wird jedes Mal neu gefragt
    best: store.get("rw-best", {}),       // "2-100-plus": 3
    garden: store.get("rw-garden", []),   // ["f2", "b0", ...]
    sound: store.get("rw-sound", true),
    owned: store.get("rw-owned", []),     // gekaufte Sachen für den Garten
    spent: store.get("rw-spent", 0),      // ausgegebene Blumen
    path: store.get("rw-path", { done: 0, stars: [] }),
    level: null,                          // { i, N } während ein Level gespielt wird
    round: null,
  };
  // Im Abenteuer-Pfad gibt das Level den Zahlenraum vor (frühe Level mit kleineren Zahlen)
  const config = () => ({ N: state.level ? state.level.N : state.N, mal: state.mal === true });

  // ---------- Ton ----------
  let audio;
  function beep(notes) {
    if (!state.sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      let t = audio.currentTime;
      for (const [freq, dur] of notes) {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = "triangle"; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(audio.destination);
        o.start(t); o.stop(t + dur + 0.02);
        t += dur * 0.8;
      }
    } catch { /* kein Ton möglich */ }
  }
  const SOUND_RIGHT = [[660, .12], [880, .18]];
  const SOUND_WRONG = [[330, .2]];
  const SOUND_DONE = [[523, .14], [659, .14], [784, .14], [1047, .3]];
  const SOUND_STREAK = [[784, .1], [988, .1], [1175, .22]];
  const SOUND_PERFECT = [[523, .12], [659, .12], [784, .12], [1047, .2], [784, .12], [1047, .4]];

  // ---------- Feuerwerk ----------
  const fx = (() => {
    const cv = $("fx"), ctx = cv.getContext("2d");
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let sparks = [], rockets = [], running = false, until = 0, nextShot = 0;
    const palette = () => {
      const cs = getComputedStyle(document.documentElement);
      return ["--petal-1", "--petal-2", "--petal-3", "--petal-4", "--sun"].map((v) => cs.getPropertyValue(v).trim() || "#f4b329");
    };
    function fit() {
      const d = window.devicePixelRatio || 1;
      cv.width = innerWidth * d; cv.height = innerHeight * d;
      ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    function burst(x, y, count = 70) {
      const cols = palette(), main = pick(cols);
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 4.5;
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, fade: 0.008 + Math.random() * 0.01, c: Math.random() < 0.25 ? pick(cols) : main });
      }
    }
    function launch() {
      rockets.push({ x: innerWidth * (0.15 + Math.random() * 0.7), y: innerHeight, vy: -(8 + Math.random() * 4), top: innerHeight * (0.12 + Math.random() * 0.3), c: pick(palette()) });
    }
    function frame(now) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      if (now < until && now > nextShot) { launch(); nextShot = now + 280 + Math.random() * 380; }
      rockets = rockets.filter((r) => {
        r.y += r.vy; r.vy += 0.12;
        ctx.globalAlpha = 1; ctx.fillStyle = r.c; ctx.fillRect(r.x - 1.5, r.y, 3, 10);
        if (r.y <= r.top || r.vy >= -1) { burst(r.x, r.y); return false; }
        return true;
      });
      sparks = sparks.filter((p) => {
        p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.05; p.x += p.vx; p.y += p.vy; p.life -= p.fade;
        if (p.life <= 0) return false;
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2); ctx.fill();
        return true;
      });
      ctx.globalAlpha = 1;
      if (sparks.length || rockets.length || now < until) requestAnimationFrame(frame);
      else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
    }
    function run() { if (!running) { running = true; fit(); requestAnimationFrame(frame); } }
    return {
      // Großes Feuerwerk über den ganzen Bildschirm
      show(seconds) { if (still) return; until = performance.now() + seconds * 1000; nextShot = 0; run(); },
      // Beim Wechsel des Bildschirms alles wegräumen
      stop() { until = 0; sparks = []; rockets = []; },
      // Kleine Explosionen über einem Element, z. B. bei einer Serie
      pop(el, count = 2) {
        if (still) return;
        const b = el.getBoundingClientRect();
        for (let i = 0; i < count; i++) burst(b.left + b.width * (i + 0.5) / count, b.top + b.height * 0.35, 45);
        run();
      },
    };
  })();

  // ---------- Ansichten ----------
  const VIEWS = ["setupView", "startView", "gameView", "resultView", "tricksView", "balloonView", "memoryView", "pathView", "gardenView"];
  function show(view) {
    for (const id of VIEWS) $(id).hidden = id !== view;
    fx.stop();
    stopSpeaking();
    if (view !== "balloonView") stopBalloons();
    window.scrollTo(0, 0);
  }

  function renderHeader() {
    $("flowerIcon").innerHTML = flowerSVG("flower", "var(--petal-1)");
    $("flowerCount").textContent = fmt(balance());
    $("soundBtn").setAttribute("aria-pressed", String(state.sound));
    $("soundBtn").setAttribute("aria-label", state.sound ? "Ton ausschalten" : "Ton einschalten");
    $("soundBtn").textContent = state.sound ? "Ton" : "Aus";
  }

  // ---------- Summi, die Rechenbiene ----------
  let beeCount = 0;
  function beeSVG() {
    const id = `beeBody${beeCount++}`;
    return `<svg viewBox="0 0 100 92" aria-hidden="true"><g class="float">
      <path d="M42 26Q36 10 27 9M58 26Q64 10 73 9" stroke="var(--bee-ink)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="27" cy="9" r="4" fill="var(--bee-ink)"/><circle cx="73" cy="9" r="4" fill="var(--bee-ink)"/>
      <ellipse cx="20" cy="42" rx="18" ry="12" fill="var(--wing)" fill-opacity=".8" stroke="var(--line)" stroke-width="1.5" transform="rotate(-25 20 42)"/>
      <ellipse cx="80" cy="42" rx="18" ry="12" fill="var(--wing)" fill-opacity=".8" stroke="var(--line)" stroke-width="1.5" transform="rotate(25 80 42)"/>

      <circle cx="39" cy="49" r="7" fill="#fff"/><circle cx="61" cy="49" r="7" fill="#fff"/>
      <circle cx="40" cy="50" r="3.6" fill="var(--bee-ink)"/><circle cx="62" cy="50" r="3.6" fill="var(--bee-ink)"/>
      <circle cx="31" cy="59" r="4" fill="var(--petal-1)" opacity=".55"/><circle cx="69" cy="59" r="4" fill="var(--petal-1)" opacity=".55"/>
      <path d="M43 59Q50 65 57 59" stroke="var(--bee-ink)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g></svg>`;
  }
  function beeMood(id, mood = "") {
    const el = $(id);
    el.classList.remove("happy", "think");
    if (mood) { void el.offsetWidth; el.classList.add(mood); }
  }

  // ---------- Android-App (Capacitor) ----------
  // In der App gibt es window.Capacitor. Im Browser bleibt alles wie gehabt.
  const cap = window.Capacitor;
  const isApp = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
  const nativeTTS = isApp ? cap.registerPlugin("TextToSpeech") : null;

  // ---------- Vorlesen ----------
  const canSpeak = !!nativeTTS || ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window);
  const SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  function stopSpeaking() {
    if (nativeTTS) nativeTTS.stop().catch(() => {});
    else if (window.speechSynthesis) speechSynthesis.cancel();
  }
  function speak(text) {
    if (!canSpeak || !text) return;
    if (nativeTTS) {   // Sprachausgabe von Android
      nativeTTS.stop().catch(() => {}).finally(() =>
        nativeTTS.speak({ text, lang: "de-DE", rate: 0.9 }).catch(() => {}));
      return;
    }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "de-DE";
      u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch { /* Vorlesen nicht möglich */ }
  }
  // Rechenaufgabe so, wie man sie laut sagt: "7 plus 5 gleich wie viel"
  function spokenTask(t) {
    const word = { "+": "plus", "−": "minus", "·": "mal", ":": "geteilt durch", "=": "gleich" };
    if (t.kind === "text") return t.text;
    if (t.kind === "parts") {
      return t.parts.map((p) => (p === "§" ? "wie viel" : word[p] || p.replace(/ Z$/, " Zehner").replace(/ E$/, " Einer"))).join(" ");
    }
    const v = (k) => (t.blank === k ? "wie viel" : fmt(t[k]));
    return `${v("a")} ${word[t.op]} ${v("b")} gleich ${v("c")}`;
  }

  // ---------- Einrichtung: eine Frage pro Bildschirm ----------
  const SETUP_SAY = [
    "Hallo! Ich bin Summi, die Rechenbiene. In welche Klasse gehst du?",
    "Bis zu welcher Zahl rechnest du schon? Tippe die Zahl ein.",
    "Kannst du schon Mal und Geteilt rechnen?",
    "Was möchtest du rechnen? Tippe alles an, was du üben magst.",
  ];
  const SETUP_STEPS = ["stepGrade", "stepRange", "stepMal", "stepTopics"];
  let setupStep = 0, rangeDigits = "", setupDone = false;

  function openSetup(step = 0) {
    setupStep = step;
    rangeDigits = state.N ? String(state.N) : "";
    $("rangeNote").textContent = "";
    $("rangeNote").classList.remove("bad");
    $("topicNote").textContent = "";
    renderSetup();
    show("setupView");
    beeMood("setupBee", "happy");
  }

  function renderSetup() {
    SETUP_STEPS.forEach((id, i) => { $(id).hidden = i !== setupStep; });
    $("steps").innerHTML = SETUP_STEPS.map((_, i) => `<span class="${i === setupStep ? "on" : ""}"></span>`).join("");
    $("setupSay").textContent = SETUP_SAY[setupStep];
    $("setupBack").hidden = setupStep === 0 && !setupDone;

    $("grades").innerHTML = Object.keys(GRADES).map((n) =>
      `<button class="grade" type="button" data-grade="${n}" aria-pressed="${Number(n) === state.grade}">
         <b>${n}</b><small>Klasse</small></button>`).join("");

    $("rangeShow").textContent = rangeDigits ? fmt(Number(rangeDigits)) : "?";
    $("rangeShow").classList.toggle("filled", !!rangeDigits);
    if (!$("rangeNote").textContent) $("rangeNote").textContent = `Zum Beispiel ${state.grade ? GRADES[state.grade].example.replace("z. B. ", "") : "20"}.`;

    for (const b of $("malChoice").querySelectorAll("[data-mal]")) {
      b.setAttribute("aria-pressed", String(state.mal !== null && (b.dataset.mal === "1") === state.mal));
    }

    const N = state.N || 100;
    const topics = topicsFor({ N, mal: state.mal === true });
    state.topics = state.topics.filter((t) => topics.includes(t));   // z. B. Mal fällt weg bei "Noch nicht"
    const allOn = topics.every((t) => state.topics.includes(t));
    $("topics").innerHTML = [...topics, "all"].map((t) => {
      const best = state.N && t !== "all" ? state.best[`${state.grade}-${state.N}-${t}`] || 0 : 0;
      const stars = t === "all" ? `<span class="stars none">alle Themen</span>`
        : best ? `<span class="stars" aria-label="${best} von 3 Sternen">${"★".repeat(best)}${"☆".repeat(3 - best)}</span>`
               : `<span class="stars none">neu</span>`;
      const wide = topics.length % 2 === 0 && t === "all" ? " wide" : "";
      const on = t === "all" ? allOn : state.topics.includes(t);
      return `<button class="topic${wide}" type="button" data-topic="${t}" aria-pressed="${on}">
        <span class="sym${TOPICS[t].small ? " small" : ""}">${topicSym(t, N)}</span><span><span class="name">${topicName(t, N)}</span>${stars}</span></button>`;
    }).join("");
  }

  function setupNext() {
    setupStep++;
    renderSetup();
    beeMood("setupBee", "happy");
    window.scrollTo(0, 0);
  }

  // Zahlenfeld für "Bis zu welcher Zahl?"
  function rangeKey(k) {
    if (k === "del") rangeDigits = rangeDigits.slice(0, -1);
    else if (k === "ok") {
      const N = Number(rangeDigits);
      let msg = "";
      if (!rangeDigits) msg = "Tippe zuerst eine Zahl ein.";
      else if (N < MIN_N) msg = `Nimm mindestens ${MIN_N}.`;
      else if (N > MAX_N) msg = `Höchstens ${fmt(MAX_N)}. Das ist eine Million!`;
      $("rangeNote").textContent = msg;
      $("rangeNote").classList.toggle("bad", !!msg);
      if (msg) { beeMood("setupBee", "think"); beep(SOUND_WRONG); renderSetup(); return; }
      state.N = N;
      $("rangeNote").textContent = noteFor(N);
      return setupNext();
    } else if (rangeDigits.length < 7) rangeDigits = (rangeDigits === "0" ? "" : rangeDigits) + k;
    $("rangeNote").textContent = "";
    $("rangeNote").classList.remove("bad");
    renderSetup();
  }

  function finishSetup() {
    if (!state.topics.length) {
      $("topicNote").textContent = "Tippe mindestens ein Thema an.";
      $("topicNote").classList.add("bad");
      beeMood("setupBee", "think");
      return;
    }
    setupDone = true;
    goHome("Super! Jetzt kann es losgehen. Möchtest du spielen oder Blumen sammeln?");
  }

  // ---------- Startseite ----------
  const HOME_SAY = ["Was möchtest du jetzt machen?", "Lust auf ein Spiel?", "Wollen wir zusammen rechnen?", "Toll, dass du da bist! Was spielen wir?"];
  function goHome(text) {
    renderHome(text || pick(HOME_SAY));
    show("startView");
    beeMood("homeBee", "happy");
  }

  function renderHome(text) {
    $("homeSay").textContent = text;
    $("settingsText").textContent = `Klasse ${state.grade} · bis ${fmt(state.N)} · ${state.mal ? "mit" : "ohne"} Mal und Geteilt · ${state.topics.map((t) => topicName(t, state.N)).join(", ")}`;
    const done = state.path.done;
    $("pathInfo").textContent = done >= LEVELS.length ? "Alle Level geschafft!" : `Weiter mit Level ${done + 1} von ${LEVELS.length}: ${LEVELS[done].place}`;
    $("gardenInfo").textContent = `${balance()} Blumen zum Ausgeben · ${state.owned.length} von ${SHOP.length} Sachen im Garten`;
    renderHeader();
  }

  // Alles gefragt? Sonst zurück zu Summis Fragen
  function ready() {
    if (state.grade && state.N && state.mal !== null && state.topics.length) return true;
    openSetup(!state.grade ? 0 : !state.N ? 1 : state.mal === null ? 2 : 3);
    return false;
  }

  // ---------- Spiel ----------
  function startRound() {
    if (!ready()) return;
    const N = config().N;
    const sel = [...state.topics];
    state.round = { tasks: makeRound(config(), sel), sel, N, i: 0, input: "", tries: 0, results: [], locked: false, streak: 0 };
    $("where").textContent = state.level ? `Level ${state.level.i + 1} · ${LEVELS[state.level.i].place}` : `Bis ${rangeLabel(N)} · ${selectionName(sel, N)}`;
    renderStreak();
    resetTaskUi();
    show("gameView");
    renderTask();
  }

  function num(n, cls = "") { return `<span class="${cls}">${fmt(n)}</span>`; }

  function renderTask(mark = "") {
    const r = state.round, t = r.tasks[r.i];
    const slotText = r.input ? fmt(Number(r.input)) : "?";
    const slotCls = `slot${r.input ? " filled" : ""}${mark ? " " + mark : ""}`;
    const slot = `<span class="${slotCls}" id="slot">${slotText}</span>`;
    $("count").textContent = `${r.i + 1} / ${r.tasks.length}`;
    drawTask($("task"), t, slot);
    renderMeadow();
  }

  // Zeichnet eine Aufgabe in ein Element; slot ist das Antwortfeld
  function drawTask(el, t, slot) {
    el.classList.toggle("is-text", t.kind === "text");
    if (t.kind === "text") {
      el.innerHTML = `${t.pic ? `<div class="pic">${t.pic}</div>` : ""}<p class="story">${t.text}</p>` +
        `<div class="answer">${slot}${t.unit ? `<span class="unit">${t.unit}</span>` : ""}</div>`;
      el.setAttribute("aria-label", t.text);
    } else if (t.kind === "parts") {
      el.innerHTML = t.parts.map((p) => (p === "§" ? slot : /^[+=−·:]$/.test(p) ? `<span class="op">${p}</span>` : `<span>${p}</span>`)).join("");
      el.setAttribute("aria-label", t.parts.map((p) => (p === "§" ? "Lücke" : p)).join(" "));
    } else {
      const part = (k) => (t.blank === k ? slot : num(t[k]));
      el.innerHTML = `${part("a")}<span class="op">${t.op}</span>${part("b")}<span class="op">=</span>${part("c")}`;
      el.setAttribute("aria-label", `${t.blank === "a" ? "Lücke" : t.a} ${t.op === "·" ? "mal" : t.op === ":" ? "geteilt durch" : t.op === "+" ? "plus" : "minus"} ${t.blank === "b" ? "Lücke" : t.b} gleich ${t.blank === "c" ? "?" : t.c}`);
    }
  }

  function renderStreak(pop = false) {
    const n = state.round ? state.round.streak : 0;
    $("streak").hidden = n < 2;
    $("streak").textContent = `Serie: ${n}`;
    $("streak").classList.remove("pop");
    if (pop) { void $("streak").offsetWidth; $("streak").classList.add("pop"); }
  }

  function renderMeadow(growIndex = -1) {
    const r = state.round;
    let html = "";
    for (let i = 0; i < 10; i++) {
      const res = r.results[i];
      const cls = i === growIndex ? "grow" : "";
      if (res === "first") html += `<div class="spot"><div class="${cls}">${flowerSVG("flower", PETALS[i % 4])}</div></div>`;
      else if (res === "second") html += `<div class="spot"><div class="${cls}">${flowerSVG("bud", PETALS[i % 4])}</div></div>`;
      else if (res === "missed") html += `<div class="spot"><div class="${cls}">${flowerSVG("sprout")}</div></div>`;
      else html += `<div class="spot${i === r.i ? " now" : ""}"></div>`;
    }
    $("meadow").innerHTML = html;
  }

  function say(text, cls = "") {
    $("say").textContent = text;
    $("say").className = "say " + cls;
    if (text) beeMood("gameBee", cls === "ok" ? "happy" : cls === "oops" ? "think" : "");
  }

  function resetTaskUi() {
    say(pick(["Du schaffst das!", "Schau genau hin.", "Los geht's!", "Denk in Ruhe nach."]));
    $("help").hidden = true;
    $("help").innerHTML = "";
    $("nextBtn").hidden = true;
    $("helpBtn").hidden = false;
    setPadEnabled(true);
  }

  function type(d) {
    const r = state.round;
    if (!r || r.locked) return;
    if (d === "del") r.input = r.input.slice(0, -1);
    else if (d === "ok") return check();
    else if (r.input.length < String(r.N).length) r.input = (r.input === "0" ? "" : r.input) + d;
    if ($("say").classList.contains("oops")) say("");
    renderTask();
  }

  const PRAISE = ["Super!", "Richtig!", "Klasse!", "Toll gemacht!", "Spitze!", "Genau!", "Prima!", "Stark gerechnet!"];

  function check() {
    const r = state.round, t = r.tasks[r.i];
    if (!r.input) { say("Tippe zuerst deine Antwort ein.", "oops"); return; }
    if (Number(r.input) === t.answer) {
      r.results[r.i] = r.tries === 0 ? "first" : "second";
      r.locked = true;
      r.streak = r.tries === 0 ? r.streak + 1 : 0;
      const party = r.streak >= 3 && r.streak % 3 === 0;   // bei 3, 6 und 9 richtig hintereinander
      if (party) {
        beep(SOUND_STREAK);
        say(`${r.streak} richtig hintereinander! Super-Serie!`, "ok");
      } else {
        beep(SOUND_RIGHT);
        say(r.tries === 0 ? pick(PRAISE) : "Richtig! Gut, dass du nochmal nachgedacht hast.", "ok");
      }
      renderTask("right");
      renderMeadow(r.i);
      renderStreak(party);
      if (party) fx.pop($("task"), r.streak >= 6 ? 3 : 2);
      setPadEnabled(false);
      setTimeout(() => { if (state.round === r) nextTask(); }, party ? 1700 : 1100);
      return;
    }
    r.tries++;
    r.streak = 0;
    renderStreak();
    beep(SOUND_WRONG);
    if (r.tries === 1) {
      renderTask("wrong");
      say("Fast! Schau nochmal genau hin.", "oops");
      r.input = "";
      setTimeout(() => { if (!r.locked && r.tasks[r.i] === t) renderTask(); }, 400);
      return;
    }
    r.results[r.i] = "missed";
    r.locked = true;
    r.input = String(t.answer);
    renderTask("right");
    renderMeadow(r.i);
    say(`Die Lösung ist ${fmt(t.answer)}. Beim nächsten Mal klappt's!`, "oops");
    showHelp(true);
    setPadEnabled(false);
    $("helpBtn").hidden = true;
    $("nextBtn").hidden = false;
    $("nextBtn").focus();
  }

  function nextTask() {
    const r = state.round;
    if (!r || state.round !== r) return;
    r.i++;
    r.input = ""; r.tries = 0; r.locked = false;
    if (r.i >= r.tasks.length) return finish();
    resetTaskUi();
    renderTask();
  }

  function setPadEnabled(on) {
    for (const b of $("pad").querySelectorAll("button")) b.disabled = !on;
  }

  // ---------- Hilfe ----------
  function zwanzigerfeld(t) {
    // Rote Plättchen für die erste Zahl, blaue für die zweite (Plus) oder durchgestrichen (Minus)
    const cells = [];
    for (let i = 0; i < 20; i++) {
      let dot = "";
      if (t.op === "+") {
        if (i < t.a) dot = '<span class="dot r"></span>';
        else if (i < t.a + t.b) dot = '<span class="dot b"></span>';
      } else if (i < t.a) {
        dot = `<span class="dot r${i >= t.a - t.b ? " gone" : ""}"></span>`;
      }
      cells.push(`<span class="cell">${dot}</span>`);
    }
    return `<div class="field20" aria-hidden="true">${cells.join("")}</div>`;
  }

  function dotArray(rows, cols) {
    let dots = "";
    for (let i = 0; i < rows * cols; i++) dots += `<span class="dot ${Math.floor(i / cols) % 2 ? "b" : "r"}"></span>`;
    return `<div class="array" style="grid-template-columns: repeat(${cols}, 16px)" aria-hidden="true">${dots}</div>`;
  }

  const trailingZeros = (n) => { let z = 0; while (n && n % 10 === 0) { n /= 10; z++; } return z; };
  const zeros = (p) => { const z = trailingZeros(p); return z === 1 ? "eine Null" : `${["", "", "zwei", "drei", "vier", "fünf"][z]} Nullen`; };

  function tipFor(t) {
    const { a, b, c, op, blank } = t;
    if (blank === "a") {
      if (op === "+") return `Rechne rückwärts: ${fmt(c)} − ${fmt(b)}.`;
      if (op === "−") return `Rechne rückwärts: ${fmt(c)} + ${fmt(b)}.`;
      if (op === "·") return `Welche Zahl mal ${fmt(b)} ergibt ${fmt(c)}? Rechne ${fmt(c)} : ${fmt(b)}.`;
      return `Rechne rückwärts: ${fmt(c)} · ${fmt(b)}.`;
    }
    if (blank === "b") {
      if (op === "+") return `Wie viel fehlt von ${fmt(a)} bis ${fmt(c)}? Rechne ${fmt(c)} − ${fmt(a)}.`;
      if (op === "−") return `Wie viel musst du von ${fmt(a)} wegnehmen, um ${fmt(c)} zu bekommen? Rechne ${fmt(a)} − ${fmt(c)}.`;
      if (op === "·") return `${fmt(a)} mal wie viel ist ${fmt(c)}? Rechne ${fmt(c)} : ${fmt(a)}.`;
      return `Durch welche Zahl teilst du? Rechne ${fmt(a)} : ${fmt(c)}.`;
    }
    if (op === "+" || op === "−") {
      if (a + (op === "+" ? b : 0) <= 20) {
        const toTen = 10 - (a % 10);
        if (op === "+") {
          if (a < 10 && b >= 10) return `Tausche die Zahlen: ${b} + ${a} ist leichter.`;
          if (a < 10 && a + b > 10) return `Erst bis zur 10: ${a} + ${toTen} = 10, dann noch ${b - toTen} dazu.`;
          if (a >= 10 && a + b < 20) return `Rechne nur mit den Einern: ${a - 10} + ${b}. Die 10 bleibt.`;
          return "Zähle die roten und blauen Plättchen zusammen.";
        }
        if (a > 10 && b >= 10) return `Nimm erst die 10 weg: ${a} − 10 = ${a - 10}, dann noch ${b - 10} weg.`;
        if (a > 10 && a - b < 10) return `Erst bis zur 10: ${a} − ${a - 10} = 10, dann noch ${b - (a - 10)} weg.`;
        if (a > 10) return `Rechne nur mit den Einern: ${a - 10} − ${b}. Die 10 bleibt.`;
        return "Zähle die Plättchen, die übrig bleiben.";
      }
      // Einstellige Zahl dazu oder weg: über den nächsten Zehner rechnen
      if (b < 10) {
        const ones = a % 10, base = a - ones;
        if (op === "+") {
          const toTen = 10 - ones;
          if (!ones) return `Zu ${fmt(a)} kommen ${b} Einer dazu.`;
          if (b > toTen) return `Erst bis zur ${fmt(base + 10)}: ${fmt(a)} + ${toTen} = ${fmt(base + 10)}, dann noch ${b - toTen} dazu.`;
          return `Rechne nur mit den Einern: ${ones} + ${b}. Die Zehner bleiben gleich.`;
        }
        if (!ones) return `Denk an 10 − ${b}. Von ${fmt(a)} gehst du ${b} zurück.`;
        if (ones < b) return `Erst zurück bis ${fmt(base)}: ${fmt(a)} − ${ones} = ${fmt(base)}, dann noch ${b - ones} weg.`;
        return `Rechne nur mit den Einern: ${ones} − ${b}. Die Zehner bleiben gleich.`;
      }
      const z = Math.min(trailingZeros(a), trailingZeros(b));
      if (z) {
        const p = 10 ** z, c2 = op === "+" ? a / p + b / p : a / p - b / p;
        return `Denk dir ${zeros(p)} weg: ${fmt(a / p)} ${op} ${fmt(b / p)} = ${fmt(c2)}. Dann hänge ${zeros(p)} wieder an.`;
      }
      const big = b >= 1000 ? Math.floor(b / 1000) * 1000 : b >= 100 ? Math.floor(b / 100) * 100 : Math.floor(b / 10) * 10;
      const rest = b - big;
      if (big && rest) return `Zerlege ${fmt(b)} in ${fmt(big)} und ${fmt(rest)}: erst ${fmt(a)} ${op} ${fmt(big)} = ${fmt(op === "+" ? a + big : a - big)}, dann ${op} ${fmt(rest)}.`;
      return a < 100 ? "Rechne erst die Zehner, dann die Einer." : "Rechne Stelle für Stelle: erst die Hunderter, dann die Zehner, dann die Einer.";
    }
    if (op === "·") {
      if (b === 10 || b === 100 || b === 1000) return `Mal ${fmt(b)}: Hänge ${zeros(b)} an ${fmt(a)}.`;
      const z = trailingZeros(a);
      if (z && a / 10 ** z <= 10) return `Rechne erst ${a / 10 ** z} · ${b} = ${a / 10 ** z * b} und hänge ${zeros(10 ** z)} an.`;
      if (a > 10) {
        const p = 10 ** (String(a).length - 1), head = Math.floor(a / p) * p, rest = a - head;
        return `Zerlege: ${fmt(head)} · ${b} = ${fmt(head * b)} und ${fmt(rest)} · ${b} = ${fmt(rest * b)}. Dann addieren.`;
      }
      return `${a} Reihen mit je ${b} Punkten. Wie viele sind es zusammen?`;
    }
    const zq = trailingZeros(c);
    if (zq && b < 10) return `Rechne erst ${fmt(a / 10 ** zq)} : ${b} = ${fmt(c / 10 ** zq)} und hänge ${zeros(10 ** zq)} an.`;
    if (b >= 10 && trailingZeros(b) === String(b).length - 1 && b > 1) return `Geteilt durch ${fmt(b)}: Streiche ${zeros(b)} am Ende von ${fmt(a)}.`;
    if (a > 100 && c > 10) {
      const tens = Math.floor(c / 10) * 10;
      return `Zerlege ${fmt(a)} in ${fmt(tens * b)} und ${fmt(a - tens * b)}. Teile beide Teile durch ${b}.`;
    }
    return `Denk an die Malaufgabe: ? · ${b} = ${fmt(a)}.`;
  }

  function showHelp(afterMiss = false) {
    const t = state.round.tasks[state.round.i];
    const more = `<button class="more-tricks" type="button" data-tricks="${t.topic}">Mehr Rechentricks dazu</button>`;
    const listen = (txt) => (canSpeak ? `<button class="speak" type="button" data-speak-text="${encodeURIComponent(txt)}">${SPEAKER}Tipp vorlesen</button>` : "");
    if (t.kind) {
      $("help").innerHTML = `${t.helpPic || ""}<p>${afterMiss ? "So geht's: " : "Tipp: "}${t.tip}</p>${listen(t.tip)}${more}`;
      revealHelp();
      return;
    }
    let picture = "";
    if (t.blank === "c" && (t.op === "+" || t.op === "−") && t.a <= 20 && (t.op === "−" || t.a + t.b <= 20)) picture = zwanzigerfeld(t);
    else if (t.blank === "c" && t.op === "·" && t.a <= 10 && t.b <= 10) picture = dotArray(t.a, t.b);
    else if (t.blank === "c" && t.op === ":" && t.a <= 60) picture = dotArray(t.c, t.b);
    $("help").innerHTML = `${picture}<p>${afterMiss ? "So geht's: " : "Tipp: "}${tipFor(t)}</p>${listen(tipFor(t))}${more}`;
    revealHelp();
  }

  // Hilfe einblenden und ins Bild holen, falls sie unter dem sichtbaren Bereich liegt

    $("help").hidden = false;
    try { $("help").scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch { /* Scrollen nicht möglich */ }
  }

    { id: "geteilt", title: "Geteilt", cards: [

      { h: "Wörter, die dir das Rechenzeichen verraten", html: `<div class="signal">
          <b>+</b><span>dazu, bekommt, mehr, größer als</span>
